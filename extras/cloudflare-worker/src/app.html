<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>Bastion Alarm</title>
<style>
:root {
  color-scheme: light;
  --bg: #f4f5f7; --surface: #ffffff; --surface-2: #f1f2f4; --line: #e3e5e9; --line-strong: #cfd3d9;
  --text: #15171a; --muted: #5d636d; --accent: #2a78d6; --on-accent: #fff;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --good: #0f8a0f; --warning: #b77900; --serious: #d0602f; --critical: #d03b3b; --idle: #7c828c;
  --shadow: 0 1px 2px rgba(16,24,40,.05), 0 1px 3px rgba(16,24,40,.06);
  --radius: 14px; --radius-lg: 18px;
  --font: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #111214; --surface: #17181b; --surface-2: #1e2024; --line: #2a2d32; --line-strong: #3a3e45;
    --text: #eceef1; --muted: #a0a6b0; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
    --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e25555; --idle: #8a8f98;
    --shadow: none;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #111214; --surface: #17181b; --surface-2: #1e2024; --line: #2a2d32; --line-strong: #3a3e45;
  --text: #eceef1; --muted: #a0a6b0; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  --good: #0ca30c; --warning: #fab219; --serious: #ec835a; --critical: #e25555; --idle: #8a8f98;
  --shadow: none;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 14px/1.45 var(--font); -webkit-font-smoothing: antialiased; }
.wrap { max-width: 1180px; margin: 0 auto; padding: 0 16px; }
.muted { color: var(--muted); }
.small { font-size: 12.5px; }
.mono { font-family: var(--mono); font-size: .92em; }
button { font: inherit; color: inherit; }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }

.bar { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--surface) 90%, transparent);
  backdrop-filter: saturate(1.4) blur(12px); border-bottom: 1px solid var(--line); }
.bar-in { display: flex; align-items: center; gap: 12px; height: 60px; }
.brand { display: flex; align-items: center; gap: 10px; min-width: 0; }
.brand svg { flex: none; }
.brand b { display: block; font-size: 16px; letter-spacing: -.01em; }
.brand span { display: block; font-size: 12px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.grow { flex: 1; }
.icon-btn { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); cursor: pointer;
  display: inline-flex; align-items: center; justify-content: center; color: var(--muted); }
.icon-btn:hover { color: var(--text); border-color: var(--line-strong); }

h1 { font-size: 26px; letter-spacing: -.02em; margin: 28px 0 4px; }
h2 { font-size: 13px; font-weight: 600; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 32px 0 12px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius-lg); padding: 20px; box-shadow: var(--shadow); }
.loading, .error { padding: 80px 0; text-align: center; color: var(--muted); }

/* status hero */
.hero { display: flex; gap: 24px; align-items: center; flex-wrap: wrap; margin-top: 24px; border-left: 4px solid var(--state); }
.hero-badge { width: 64px; height: 64px; border-radius: 18px; flex: none; display: flex; align-items: center; justify-content: center;
  background: color-mix(in srgb, var(--state) 14%, transparent); color: var(--state); }
.hero-main { flex: 1; min-width: 220px; }
.hero-state { font-size: 28px; font-weight: 700; letter-spacing: -.02em; }
.hero-meta { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; color: var(--muted); }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 10px; }
.chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 999px; font-size: 12.5px;
  background: color-mix(in srgb, var(--c, var(--idle)) 12%, transparent); color: var(--text); border: 1px solid color-mix(in srgb, var(--c, var(--idle)) 30%, transparent); }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: var(--c, var(--idle)); }
.pulse { animation: pulse 1.6s ease-in-out infinite; }
@keyframes pulse { 50% { box-shadow: 0 0 0 6px color-mix(in srgb, var(--critical) 25%, transparent); } }

/* filter row */
.filters { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-top: 28px; }
.seg { display: inline-flex; padding: 3px; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.seg button { border: none; background: none; padding: 6px 14px; border-radius: 9px; cursor: pointer; color: var(--muted); font-size: 13px; }
.seg button.on { background: var(--surface-2); color: var(--text); font-weight: 600; box-shadow: var(--shadow); }

/* KPI tiles */
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(165px, 1fr)); gap: 12px; margin-top: 14px; }
.tile { padding: 16px 18px; }
.tile-label { font-size: 12px; color: var(--muted); font-weight: 600; }
.tile-value { font-size: 28px; font-weight: 700; letter-spacing: -.02em; margin-top: 4px; font-variant-numeric: tabular-nums; }
.tile-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.tile.alert .tile-value { color: var(--critical); }

/* charts */
.grid2 { display: grid; grid-template-columns: 1.7fr 1fr; gap: 14px; }
@media (max-width: 880px) { .grid2 { grid-template-columns: 1fr; } }
.chart-head { display: flex; align-items: flex-start; gap: 12px; flex-wrap: wrap; }
.chart-title { font-weight: 600; font-size: 15px; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 6px; vertical-align: -1px; }
.legend b { color: var(--text); font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
.link-btn { border: none; background: none; color: var(--accent); cursor: pointer; padding: 0; font-size: 12.5px; }
.chart { position: relative; margin-top: 14px; }
.chart svg { display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; font-family: var(--font); }
.chart .hit { fill: transparent; cursor: default; }
.chart .hit:hover { fill: color-mix(in srgb, var(--text) 5%, transparent); }
.tip { position: absolute; pointer-events: none; z-index: 4; background: var(--surface); border: 1px solid var(--line-strong); border-radius: 10px;
  padding: 8px 10px; font-size: 12.5px; box-shadow: 0 6px 24px rgba(0,0,0,.18); min-width: 150px; transform: translate(-50%, calc(-100% - 10px)); }
.tip-row { display: flex; align-items: center; gap: 8px; }
.tip-row i { width: 9px; height: 9px; border-radius: 3px; }
.tip-row b { margin-left: auto; font-variant-numeric: tabular-nums; }
.bars { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
.hbar { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 4px 10px; align-items: center; }
.hbar-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hbar-val { font-variant-numeric: tabular-nums; color: var(--muted); }
.hbar-track { grid-column: 1 / -1; height: 8px; border-radius: 4px; background: var(--surface-2); overflow: hidden; }
.hbar-fill { height: 100%; border-radius: 4px; background: var(--s1); }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th, td { text-align: left; padding: 9px 10px; border-bottom: 1px solid var(--line); vertical-align: top; }
th { color: var(--muted); font-weight: 600; font-size: 12px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.table-wrap { overflow-x: auto; margin-top: 12px; }

/* dashboard tabs */
.dtabs { display: flex; gap: 4px; margin-top: 18px; border-bottom: 1px solid var(--line); }
.dtabs a { position: relative; padding: 10px 14px; color: var(--muted); font-weight: 600; font-size: 14px; text-decoration: none; }
.dtabs a:hover { color: var(--text); text-decoration: none; }
.dtabs a.on { color: var(--text); }
.dtabs a.on::after { content: ""; position: absolute; left: 10px; right: 10px; bottom: -1px; height: 2px; border-radius: 2px; background: var(--accent); }
.hero-badge.ring { background: none; width: 64px; }
.findings { display: flex; flex-direction: column; margin-top: 10px; }
.finding { display: grid; grid-template-columns: 92px 1fr auto; gap: 10px; align-items: center; padding: 9px 0; border-bottom: 1px solid var(--line); }
.finding:last-child { border-bottom: none; }
.finding .chip { justify-content: center; }
.f-title { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.chip.tiny { padding: 0 7px; font-size: 11px; }
.chip.tiny::before { width: 6px; height: 6px; }
@media (max-width: 600px) { .finding { grid-template-columns: 1fr; gap: 4px; } .f-cat { display: none; } }

/* incidents */
.incidents { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
.incident { display: block; color: inherit; border-left: 4px solid var(--c); transition: border-color .15s, transform .15s; }
.incident:hover { text-decoration: none; transform: translateY(-1px); border-color: var(--c); }
.incident-top { display: flex; align-items: center; gap: 8px; }
.incident-title { font-weight: 600; font-size: 15px; margin-top: 8px; }
.incident-meta { display: flex; flex-wrap: wrap; gap: 4px 12px; margin-top: 6px; font-size: 12.5px; color: var(--muted); }

/* log */
.log-ev { display: inline-flex; align-items: center; gap: 8px; white-space: nowrap; }
.log-ev i { width: 8px; height: 8px; border-radius: 50%; background: var(--c, var(--idle)); flex: none; }

/* incident page */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 74px 14px 1fr; gap: 10px; padding: 8px 0; }
.timeline .t { color: var(--muted); font-variant-numeric: tabular-nums; font-size: 13px; }
.timeline .d { width: 10px; height: 10px; border-radius: 50%; margin-top: 5px; background: var(--c, var(--idle)); }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; }
.shot { margin: 0; border-radius: var(--radius); overflow: hidden; background: var(--surface-2); border: 1px solid var(--line); cursor: zoom-in; }
.shot .ph { aspect-ratio: 16 / 9; display: flex; align-items: center; justify-content: center; color: var(--muted); font-size: 12px; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { padding: 8px 10px; font-size: 12px; color: var(--muted); display: flex; gap: 8px; }
.lightbox { position: fixed; inset: 0; z-index: 10; background: rgba(0,0,0,.86); display: flex; align-items: center; justify-content: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 10px; }
footer { padding: 40px 0 28px; text-align: center; }
@media (max-width: 600px) { h1 { font-size: 22px; } .hero-state { font-size: 23px; } .tile-value { font-size: 24px; } .hide-sm { display: none; } }
</style>
</head>
<body>
<header class="bar"><div class="wrap bar-in">
  <div class="brand">
    <svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="var(--accent)" d="M12 1.5 3.5 5v6.2c0 5.2 3.6 10 8.5 11.3 4.9-1.3 8.5-6.1 8.5-11.3V5L12 1.5Z"/><path fill="#fff" d="M12 7.2a2.6 2.6 0 0 0-1.3 4.85V16h2.6v-3.95A2.6 2.6 0 0 0 12 7.2Z"/></svg>
    <div><b>Bastion</b><span id="instance">Alarmanlage</span></div>
  </div>
  <span class="grow"></span>
  <span id="who" class="muted small hide-sm"></span>
  <button class="icon-btn" id="theme" title="Darstellung" aria-label="Darstellung wechseln"><svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 2a10 10 0 1 0 0 20 10 10 0 0 0 0-20Zm0 2v16a8 8 0 0 1 0-16Z"/></svg></button>
</div></header>
<main class="wrap" id="app"><div class="loading">Lädt …</div></main>
<footer class="muted small">Bastion · nur lesend</footer>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MODES = { home: "Zuhause", night: "Nacht", away: "Abwesend" };
  const MODE_KEYS = ["home", "night", "away"];
  const MODE_VAR = { home: "var(--s1)", night: "var(--s2)", away: "var(--s3)" };
  const LABELS = {
    triggered: "Alarm", pending: "Vorwarnung", arming: "Wird scharf", armed: "Scharf", rearmed: "Wieder scharf",
    disarmed: "Unscharf", reset: "Zurückgesetzt", arm_failed: "Scharfschalten fehlgeschlagen", wrong_code: "Falscher Code",
    sensor_unavailable: "Sensor nicht erreichbar", acknowledged: "Quittiert", offline: "Funkstille", online: "Wieder erreichbar", restart: "Neustart", attack: "Angriffsversuch am Worker",
  };
  const EV_COLOR = {
    triggered: "var(--critical)", pending: "var(--warning)", wrong_code: "var(--serious)", arm_failed: "var(--serious)",
    offline: "var(--serious)", sensor_unavailable: "var(--warning)", disarmed: "var(--good)", online: "var(--good)", acknowledged: "var(--good)",
    armed: "var(--accent)", arming: "var(--accent)", rearmed: "var(--accent)", attack: "var(--critical)",
  };
  const GROUPS = {
    alarm: ["triggered", "pending", "acknowledged", "sensor_unavailable"],
    ops: ["armed", "arming", "rearmed", "disarmed", "reset", "arm_failed", "wrong_code"],
    system: ["offline", "online", "restart", "attack"],
  };
  let TZ = "Europe/Berlin";

  // ------------------------------------------------------------- theme
  const themes = ["auto", "light", "dark"];
  let theme = "auto";
  try { theme = localStorage.getItem("bastion-theme") || "auto"; } catch { /* storage blocked */ }
  const applyTheme = () => {
    if (theme === "auto") document.documentElement.removeAttribute("data-theme");
    else document.documentElement.setAttribute("data-theme", theme);
    document.getElementById("theme").title = `Darstellung: ${{ auto: "System", light: "Hell", dark: "Dunkel" }[theme]}`;
  };
  applyTheme();
  document.getElementById("theme").addEventListener("click", () => {
    theme = themes[(themes.indexOf(theme) + 1) % themes.length];
    try { localStorage.setItem("bastion-theme", theme); } catch { /* ignore */ }
    applyTheme();
  });

  // ------------------------------------------------------------ format
  const fmt = (ts, opts) => {
    try { return new Date(ts * 1000).toLocaleString("de-DE", { timeZone: TZ, ...opts }); }
    catch { return new Date(ts * 1000).toLocaleString("de-DE", opts); }
  };
  const dateTime = (ts) => fmt(ts, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const timeOnly = (ts) => fmt(ts, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const dayKey = (ts) => fmt(ts, { year: "numeric", month: "2-digit", day: "2-digit" });
  const dayShort = (ts) => fmt(ts, { day: "2-digit", month: "2-digit" });
  const weekday = (ts) => fmt(ts, { weekday: "short", day: "2-digit", month: "2-digit" });
  const secOfDay = (ts) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(ts * 1000)).map((x) => [x.type, x.value]));
    return Number(p.hour) * 3600 + Number(p.minute) * 60 + Number(p.second);
  };
  const rel = (ts) => {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "gerade eben";
    if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
    if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
    return `vor ${Math.round(s / 86400)} T.`;
  };
  const hours = (s) => (s / 3600 >= 10 ? Math.round(s / 3600) : (s / 3600).toFixed(1).replace(".", ",")) + " h";
  const duration = (s) => {
    if (s < 60) return `${Math.round(s)} s`;
    if (s < 3600) return `${Math.round(s / 60)} Min.`;
    return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} Min.`;
  };
  const where = (e) => [e.sensor, e.room].filter(Boolean).join(" · ");
  const isArmed = (state) => Boolean(state && (state.startsWith("armed_") || state === "pending" || state === "triggered"));

  async function api(path) {
    const r = await fetch(path, { credentials: "same-origin", headers: { accept: "application/json" } });
    if (!r.ok) throw new Error(r.status === 404 ? "Nicht gefunden oder keine Berechtigung." : `Fehler ${r.status}`);
    return r.json();
  }

  // --------------------------------------------------------- analysis
  function analyse(d) {
    const since = d.now - d.days * 86400;
    const end = d.hb && d.hb.offline ? Math.min(d.now, d.hb.received) : d.now;
    const perDay = new Map();
    for (let t = since; t <= d.now + 86400; t += 86400) perDay.set(dayKey(t), { key: dayKey(t), ts: t, home: 0, night: 0, away: 0 });
    const addSpan = (from, to, st) => {
      if (!st || !isArmed(st.state) || !MODES[st.mode]) return;
      let t = Math.max(from, since);
      while (t < to) {
        const next = Math.min(to, t - secOfDay(t) + 86400);
        const bucket = perDay.get(dayKey(t));
        if (bucket) bucket[st.mode] += next - t;
        t = next > t ? next : to;
      }
    };
    let cur = d.before ? { state: d.before.state, mode: d.before.mode } : null;
    let t0 = since;
    for (const e of d.events) {
      if (!e.state) continue;
      addSpan(t0, e.ts, cur);
      cur = { state: e.state, mode: e.mode };
      t0 = e.ts;
    }
    addSpan(t0, end, cur);
    const days = [...perDay.values()].filter((x) => x.ts <= d.now).slice(-d.days);
    const totals = { home: 0, night: 0, away: 0 };
    for (const x of days) for (const m of MODE_KEYS) totals[m] += x[m];

    const count = (k) => d.events.filter((e) => e.event === k).length;
    const incidents = new Map();
    for (const e of d.events) {
      if (!e.incident) continue;
      const inc = incidents.get(e.incident) || { id: e.incident, start: e.ts, end: e.ts, events: [] };
      inc.end = e.ts;
      inc.events.push(e);
      incidents.set(e.incident, inc);
    }
    const list = [...incidents.values()].map((inc) => {
      const first = inc.events.find((e) => e.event === "pending" || e.event === "triggered") || inc.events[0];
      const trig = inc.events.find((e) => e.event === "triggered");
      const ack = inc.events.find((e) => e.event === "acknowledged");
      const dis = inc.events.find((e) => e.event === "disarmed");
      return { ...inc, first, triggered: Boolean(trig), trig, ack, dis, shots: d.snapshots[inc.id] || 0 };
    }).sort((a, b) => b.start - a.start);

    const ackTimes = d.receipts.filter((r) => r.kind === "alarm" && r.acked_at).map((r) => r.acked_at - r.ts).sort((a, b) => a - b);
    const median = ackTimes.length ? ackTimes[Math.floor(ackTimes.length / 2)] : null;
    const outages = d.events.filter((e) => e.event === "online");
    const outageSec = outages.reduce((s, e) => s + ((e.detail && e.detail.minutes) || 0) * 60, 0);
    const triggers = new Map();
    for (const e of d.events) {
      if ((e.event === "pending" || e.event === "triggered") && e.sensor) {
        const k = e.sensor + (e.room ? ` · ${e.room}` : "");
        const cur2 = triggers.get(k) || { name: e.sensor, room: e.room, n: 0 };
        if (e.event === "pending" || !list.find((i) => i.id === e.incident && i.events.some((x) => x.event === "pending"))) cur2.n += 1;
        triggers.set(k, cur2);
      }
    }
    return {
      days, totals, incidents: list,
      kpi: {
        alarms: count("triggered"),
        pending: count("pending"),
        defused: list.filter((i) => !i.triggered && i.events.some((e) => e.event === "pending")).length,
        armedShare: (totals.home + totals.night + totals.away) / Math.max(1, end - since),
        outages: outages.length + (d.hb && d.hb.offline ? 1 : 0),
        outageSec,
        wrong: count("wrong_code"),
        ackMedian: median,
        acked: ackTimes.length,
        shots: Object.values(d.snapshots).reduce((s, n) => s + n, 0),
      },
      triggers: [...triggers.values()].sort((a, b) => b.n - a.n).slice(0, 8),
    };
  }

  // ------------------------------------------------------------- views
  const STATE_VIEW = {
    disarmed: ["Aus", "var(--good)"], arming: ["Wird scharf", "var(--accent)"], pending: ["Vorwarnung", "var(--warning)"],
    triggered: ["ALARM", "var(--critical)"], armed_home: ["Scharf · Zuhause", "var(--accent)"], armed_night: ["Scharf · Nacht", "var(--accent)"],
    armed_away: ["Scharf · Abwesend", "var(--accent)"],
  };
  const shieldIcon = '<svg width="30" height="30" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 1.5 3.5 5v6.2c0 5.2 3.6 10 8.5 11.3 4.9-1.3 8.5-6.1 8.5-11.3V5L12 1.5Zm0 2.2 6.5 2.7v4.8c0 4.1-2.7 7.9-6.5 9.1-3.8-1.2-6.5-5-6.5-9.1V6.4L12 3.7Z"/></svg>';

  function heroView(d) {
    const hb = d.hb;
    if (!hb) return `<section class="card hero" style="--state:var(--idle)"><div class="hero-badge">${shieldIcon}</div><div class="hero-main"><div class="hero-state">Noch keine Daten</div><div class="hero-meta">Home Assistant hat sich noch nicht gemeldet.</div></div></section>`;

  function tile(label, value, sub, alert) {
    return `<div class="card tile ${alert ? "alert" : ""}"><div class="tile-label">${esc(label)}</div><div class="tile-value">${esc(value)}</div>${sub ? `<div class="tile-sub">${esc(sub)}</div>` : ""}</div>`;
  }

  // Stacked daily bars: rows [{ts, <key>: value}], series [{key, label, color}].
  function stackSvg(rows, series, width, opts) {
    const W = Math.max(280, Math.round(width)), H = W < 500 ? 190 : 230, L = 34, B = 24, T = 8, R = 4;
    const max = opts.max;
    const cw = (W - L - R) / rows.length;
    const bw = Math.max(3, Math.min(26, cw - Math.max(2, cw * 0.28)));
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let svg = `<g class="grid">${opts.ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
    svg += `<g class="axis">${opts.ticks.map((t) => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${esc(opts.tick(t))}</text>`).join("")}`;
    const every = Math.ceil(rows.length / Math.max(3, Math.floor(W / 90)));
    rows.forEach((row, i) => {
      if ((rows.length - 1 - i) % every === 0) svg += `<text x="${L + cw * i + cw / 2}" y="${H - 6}" text-anchor="middle">${esc(dayShort(row.ts))}</text>`;
    });
    svg += "</g><g>";
    rows.forEach((row, i) => {
      const x = L + cw * i + (cw - bw) / 2;
      let acc = 0;
      const segs = series.filter((s) => row[s.key] > 0);
      segs.forEach((s, j) => {
        const y0 = y(acc), y1 = y(acc + row[s.key]);
        acc += row[s.key];
        const gap = j > 0 ? 2 : 0;
        const h = Math.max(0, y0 - y1 - gap);
        if (h <= 0) return;
        const r = j === segs.length - 1 ? Math.min(4, h, bw / 2) : 0;
        const yt = y0 - gap - h;
        svg += r
          ? `<path fill="${s.color}" d="M${x},${y0 - gap} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y0 - gap} Z"/>`
          : `<rect fill="${s.color}" x="${x}" y="${yt}" width="${bw}" height="${h}"/>`;
      });
      svg += `<rect class="hit" data-i="${i}" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}"/>`;
    });
    svg += "</g>";
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${svg}</svg>`;
  }

  function niceMax(v) {
    if (v <= 4) return 4;
    const step = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * step) return m * step;
    return 10 * step;
  }

  function stackCard({ id, title, sub, rows, series, totals, fmt, showTable, toggle }) {
    const legend = series.length > 1 || totals
      ? `<div class="legend">${series.map((s) => `<span><i style="background:${s.color}"></i>${esc(s.label)}<b>${esc(fmt(totals ? totals[s.key] : rows.reduce((n, r) => n + r[s.key], 0)))}</b></span>`).join("")}</div>`
      : "";
    const table = `<div class="table-wrap"><table><thead><tr><th>Tag</th>${series.map((s) => `<th class="num">${esc(s.label)}</th>`).join("")}${series.length > 1 ? `<th class="num">Gesamt</th>` : ""}</tr></thead><tbody>
      ${[...rows].reverse().map((r) => `<tr><td>${esc(weekday(r.ts))}</td>${series.map((s) => `<td class="num">${r[s.key] ? esc(fmt(r[s.key])) : "–"}</td>`).join("")}${series.length > 1 ? `<td class="num">${esc(fmt(series.reduce((n, s) => n + r[s.key], 0)))}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>`;
    return `<section class="card">
      <div class="chart-head"><div class="grow"><div class="chart-title">${esc(title)}</div>${sub ? `<div class="muted small">${esc(sub)}</div>` : ""}${legend}</div>
        <button class="link-btn" data-toggle-table="${toggle}">${showTable ? "Diagramm" : "Tabelle"}</button></div>
      ${showTable ? table : `<div class="chart" id="${id}"></div>`}
    </section>`;
  }

  function bindStack(id, rows, series, opts, fmt) {
    const box = document.getElementById(id);
    if (!box) return;
    box.innerHTML = stackSvg(rows, series, box.clientWidth, opts);
    let tip = null;
    box.addEventListener("mousemove", (ev) => {
      const hit = ev.target.closest(".hit");
      if (!hit) { if (tip) { tip.remove(); tip = null; } return; }
      const row = rows[Number(hit.dataset.i)];
      if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
      const total = series.reduce((n, s) => n + row[s.key], 0);
      tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(weekday(row.ts))}</div>` +
        series.map((s) => `<div class="tip-row"><i style="background:${s.color}"></i>${esc(s.label)}<b>${row[s.key] ? esc(fmt(row[s.key])) : "–"}</b></div>`).join("") +
        (series.length > 1 ? `<div class="tip-row muted" style="margin-top:4px">Gesamt<b>${esc(fmt(total))}</b></div>` : "");
      const rb = box.getBoundingClientRect();
      const hb = hit.getBoundingClientRect();
      tip.style.left = `${Math.min(rb.width - 80, Math.max(80, hb.left - rb.left + hb.width / 2))}px`;
      tip.style.top = `${ev.clientY - rb.top}px`;
    });
    box.addEventListener("mouseleave", () => { if (tip) { tip.remove(); tip = null; } });
  }

  const MODE_SERIES = MODE_KEYS.map((m) => ({ key: m, label: MODES[m], color: MODE_VAR[m] }));
  const ARMED_OPTS = { max: 86400, ticks: [0, 6, 12, 18, 24].map((h) => h * 3600), tick: (t) => `${t / 3600}h`, label: "Scharf-Zeit pro Tag nach Modus" };

  function triggersCard(a) {
    const max = Math.max(1, ...a.triggers.map((x) => x.n));
    return `<section class="card"><div class="chart-title">Häufigste Auslöser</div>
      <div class="muted small">Vorwarnungen und Alarme pro Sensor</div>
      ${a.triggers.length ? `<div class="bars">${a.triggers.map((x) => `<div class="hbar" title="${esc(x.name)}${x.room ? ` · ${esc(x.room)}` : ""}">
        <span class="hbar-name">${esc(x.name)}${x.room ? ` <span class="muted">· ${esc(x.room)}</span>` : ""}</span><span class="hbar-val">${x.n}</span>
        <div class="hbar-track"><div class="hbar-fill" style="width:${(x.n / max) * 100}%"></div></div></div>`).join("")}</div>`
        : `<div class="muted" style="margin-top:18px">Keine Auslösungen im Zeitraum.</div>`}
    </section>`;
  }

  function incidentCard(inc) {
    const color = inc.triggered ? "var(--critical)" : "var(--warning)";
    const meta = [];
    if (inc.ack) meta.push(`quittiert von ${esc(inc.ack.user || "Pushover")}`);
    if (inc.dis) meta.push(`unscharf${inc.dis.user ? ` von ${esc(inc.dis.user)}` : ""} nach ${esc(duration(inc.dis.ts - inc.start))}`);
    if (inc.shots) meta.push(`${inc.shots} Bild${inc.shots === 1 ? "" : "er"}`);
    return `<a class="card incident" style="--c:${color}" href="/i/${esc(inc.id)}">
      <div class="incident-top"><span class="chip" style="--c:${color}">${inc.triggered ? "Alarm" : "Vorwarnung entschärft"}</span><span class="grow"></span><span class="muted small">${esc(dateTime(inc.start))}</span></div>
      <div class="incident-title">${esc(where(inc.first) || LABELS[inc.first.event] || "Vorfall")}</div>
      <div class="incident-meta">${meta.map((m) => `<span>${m}</span>`).join("") || "<span>offen</span>"}</div>
    </a>`;

  function logView(d, filter) {
    const all = [...d.events].reverse().filter((e) => filter === "all" || (GROUPS[filter] || []).includes(e.event));
    const evs = all.slice(0, view.logLimit);
    const btn = (k, l) => `<button class="${filter === k ? "on" : ""}" data-log="${k}">${l}</button>`;
    return `<div class="filters" style="margin-top:0"><div class="seg">${btn("all", "Alle")}${btn("alarm", "Alarm")}${btn("ops", "Bedienung")}${btn("system", "System")}</div></div>
      <div class="card" style="margin-top:12px;padding:6px 10px"><div class="table-wrap" style="margin:0"><table>
        <thead><tr><th>Zeit</th><th>Ereignis</th><th>Details</th></tr></thead><tbody>
        ${evs.length ? evs.map((e) => {
          const det = [e.mode && MODES[e.mode] && !["acknowledged", "online", "offline", "restart"].includes(e.event) ? MODES[e.mode] : "", where(e), e.user,
            e.detail && e.detail.minutes ? `${e.detail.minutes} Min.` : "", e.detail && (e.detail.cause || e.detail.verdict) || "",
            e.detail && e.detail.sensors ? `offen: ${e.detail.sensors.join(", ")}` : "",
            e.event === "attack" && e.detail ? `${e.detail.total} abgewiesen, ${(e.detail.sources || []).map((x) => x.ip).join(", ")}` : ""].filter(Boolean).join(" · ");
          return `<tr><td class="muted" style="white-space:nowrap">${esc(dateTime(e.ts))}</td>
            <td><span class="log-ev" style="--c:${EV_COLOR[e.event] || "var(--idle)"}"><i></i>${esc(LABELS[e.event] || e.event)}</span></td>
            <td>${esc(det)}${e.incident ? ` <a href="/i/${esc(e.incident)}">Vorfall</a>` : ""}</td></tr>`;
        }).join("") : `<tr><td colspan="3" class="muted">Keine Ereignisse.</td></tr>`}
        </tbody></table></div>
        ${all.length > evs.length ? `<div style="padding:10px;text-align:center"><button class="link-btn" data-more>Weitere ${Math.min(50, all.length - evs.length)} von ${all.length - evs.length} anzeigen</button></div>` : ""}</div>`;
  }

  // ----------------------------------------------------------- security
  const SEV_VIEW = {
    critical: ["Kritisch", "var(--critical)"], high: ["Hoch", "var(--serious)"], medium: ["Mittel", "var(--warning)"],
    low: ["Niedrig", "var(--s1)"], info: ["Info", "var(--idle)"],
  };
  const CATEGORY = { access: "Zugang", exposure: "Erreichbarkeit", updates: "Updates", supply_chain: "Integrationen", config: "Konfiguration", git: "Git", anomaly: "Anomalie" };
  const SEC_LABELS = {
    login: "Anmeldung", new_ip: "Neue IP", token_new_ip: "Token von neuer IP", failed_login: "Fehlversuch", brute_force: "Brute-Force-Verdacht",
    ip_banned: "IP gesperrt (HA)", token_created: "Token erstellt", token_removed: "Token entfernt", user_added: "Benutzer angelegt",
    user_removed: "Benutzer gelöscht", admin_granted: "Admin-Rechte vergeben", user_activated: "Benutzer aktiviert", canary: "Köder ausgelöst",
    blocked: "Gesperrt (Bastion)", confirmed: "Bestätigt", unusual_login_time: "Ungewöhnliche Anmeldezeit", unusual_action: "Ungewöhnliche Aktion",
    sabotage: "Sabotageverdacht", tamper: "Manipulation", new_destination: "Neues Verbindungsziel", external_config_change: "Konfiguration extern geändert",
  };
  const SEC_COLOR = {
    login: "var(--good)", confirmed: "var(--good)", failed_login: "var(--serious)", brute_force: "var(--critical)", ip_banned: "var(--critical)",
    canary: "var(--critical)", blocked: "var(--critical)", sabotage: "var(--critical)", tamper: "var(--critical)", admin_granted: "var(--serious)",
    new_ip: "var(--warning)", token_new_ip: "var(--warning)", token_created: "var(--warning)", user_added: "var(--warning)",
  };
  const SEC_GROUPS = {
    failed: ["failed_login", "brute_force", "ip_banned", "blocked"],
    logins: ["login", "new_ip", "token_new_ip", "confirmed"],
    accounts: ["token_created", "token_removed", "user_added", "user_removed", "admin_granted", "user_activated"],
  };
  const ATTACK_KIND = { signature: "Signatur", probe_token: "Probe-Token", callback: "Pushover-Rückruf", link_token: "Vorfall-Link", access: "Access" };
  const SEC_SERIES = [{ key: "ha", label: "Home Assistant", color: "var(--s1)" }, { key: "worker", label: "Worker", color: "var(--s2)" }];
  const level = (score) => (score >= 90 ? ["Gut", "var(--good)"] : score >= 70 ? ["Ausbaufähig", "var(--warning)"] : score >= 50 ? ["Riskant", "var(--serious)"] : ["Kritisch", "var(--critical)"]);

  function dayRows(d, init) {
    const since = d.now - d.days * 86400;
    const map = new Map();
    for (let t = since; t <= d.now; t += 86400) map.set(dayKey(t), { ts: t, ...init() });
    if (!map.has(dayKey(d.now))) map.set(dayKey(d.now), { ts: d.now, ...init() });
    return map;
  }

  function analyseSecurity(d) {
    const ev = d.secevents || [];
    const attempts = d.attempts || [];
    const days = dayRows(d, () => ({ ha: 0, worker: 0 }));
    const sources = new Map();
    const src = (ip, geo) => {
      const cur = sources.get(ip) || { ip, geo: geo || "", ha: 0, worker: 0, blocked: false };
      if (geo && !cur.geo) cur.geo = geo;
      sources.set(ip, cur);
      return cur;
    };
    for (const e of ev) {
      if (e.type !== "failed_login") continue;
      const row = days.get(dayKey(e.ts));
      if (row) row.ha += 1;
      if (e.ip) src(e.ip, e.geo).ha += 1;
    }
    for (const a of attempts) {
      const row = days.get(dayKey(a.ts));
      if (row) row.worker += a.n;
      src(a.ip, a.country).worker += a.n;
    }
    const active = (d.blocked || []).filter((b) => b.until > d.now);
    for (const b of active) if (sources.has(b.ip)) sources.get(b.ip).blocked = true;
    const count = (types) => ev.filter((e) => types.includes(e.type)).length;
    return {
      days: [...days.values()].slice(-d.days),
      failed: count(["failed_login"]),
      logins: count(["login"]),
      newIps: count(["new_ip", "token_new_ip"]),
      banned: count(["ip_banned", "blocked"]),
      brute: count(["brute_force"]),
      accounts: count(SEC_GROUPS.accounts),
      workerAttempts: attempts.reduce((n, a) => n + a.n, 0),
      blockedActive: active,
      sources: [...sources.values()].map((x) => ({ ...x, n: x.ha + x.worker })).sort((a, b) => b.n - a.n).slice(0, 8),
    };
  }

  function scoreRing(score, color) {
    const r = 26, c = 2 * Math.PI * r, dash = (Math.max(0, Math.min(100, score)) / 100) * c;
    return `<svg width="64" height="64" viewBox="0 0 64 64" aria-hidden="true"><circle cx="32" cy="32" r="${r}" fill="none" stroke="var(--surface-2)" stroke-width="7"/>
      <circle cx="32" cy="32" r="${r}" fill="none" stroke="${color}" stroke-width="7" stroke-linecap="round" stroke-dasharray="${dash} ${c}" transform="rotate(-90 32 32)"/>
      <text x="32" y="37" text-anchor="middle" font-size="16" font-weight="700" fill="var(--text)" font-family="inherit">${Math.round(score)}</text></svg>`;
  }

  function securityHero(sec) {
    if (!sec) return `<section class="card hero" style="--state:var(--idle)"><div class="hero-main"><div class="hero-state">Noch kein Sicherheitsüberblick</div><div class="hero-meta">Bastion schickt ihn mit dem nächsten Lebenszeichen (ab Version 0.4.1).</div></div></section>`;
    const [label, color] = level(sec.score);
    const chips = ["critical", "high", "medium", "low"].filter((k) => sec.counts[k]).map((k) => `<span class="chip" style="--c:${SEV_VIEW[k][1]}">${sec.counts[k]} ${SEV_VIEW[k][0]}</span>`);
    const audit = sec.last_audit ? Date.parse(sec.last_audit) / 1000 : null;
    return `<section class="card hero" style="--state:${color}">
      <div class="hero-badge ring">${scoreRing(sec.score, color)}</div>
      <div class="hero-main">
        <div class="hero-state" style="color:${color}">Sicherheitswert ${Math.round(sec.score)} · ${label}</div>
        <div class="hero-meta">
          <span>${sec.open} offene Befunde</span>
          ${audit ? `<span>Audit ${esc(rel(audit))}</span>` : ""}
          ${sec.git && sec.git.status && sec.git.status !== "disabled" ? `<span>Git: ${esc(sec.git.status)}</span>` : ""}
          <span>Stand ${esc(rel(sec.received))}</span>
        </div>
        ${chips.length ? `<div class="chips">${chips.join("")}</div>` : ""}
      </div>
    </section>`;
  }

  function findingsCard(sec) {
    const list = (sec && sec.findings) || [];
    return `<section class="card"><div class="chart-title">Offene Befunde</div>
      ${list.length ? `<div class="findings">${list.slice(0, 12).map((f) => {
        const [lab, col] = SEV_VIEW[f.severity] || SEV_VIEW.info;
        return `<div class="finding"><span class="chip" style="--c:${col}">${lab}</span><span class="f-title">${esc(f.title)}</span><span class="muted small f-cat">${esc(CATEGORY[f.category] || f.category)}</span></div>`;
      }).join("")}${list.length > 12 ? `<div class="muted small" style="padding-top:8px">und ${list.length - 12} weitere</div>` : ""}</div>`
        : `<div class="muted" style="margin-top:14px">Keine offenen Befunde.</div>`}</section>`;
  }

  function sourcesCard(s) {
    const max = Math.max(1, ...s.sources.map((x) => x.n));
    return `<section class="card"><div class="chart-title">Häufigste Quellen</div>
      <div class="muted small">Fehlversuche bei HA und abgewiesene Zugriffe am Worker pro IP</div>
      ${s.sources.length ? `<div class="bars">${s.sources.map((x) => `<div class="hbar" title="HA ${x.ha} · Worker ${x.worker}">
        <span class="hbar-name mono">${esc(x.ip)}${x.geo ? ` <span class="muted">· ${esc(x.geo)}</span>` : ""}${x.blocked ? ` <span class="chip tiny" style="--c:var(--critical)">gesperrt</span>` : ""}</span><span class="hbar-val">${x.n}</span>
        <div class="hbar-track"><div class="hbar-fill" style="width:${(x.n / max) * 100}%"></div></div></div>`).join("")}</div>`
        : `<div class="muted" style="margin-top:18px">Keine Fehlversuche im Zeitraum.</div>`}</section>`;
  }

  function secLogView(d, filter) {
    const all = (d.secevents || []).filter((e) => filter === "all" || (SEC_GROUPS[filter] || []).includes(e.type));
    const evs = all.slice(0, view.secLimit);
    const btn = (k, l) => `<button class="${filter === k ? "on" : ""}" data-seclog="${k}">${l}</button>`;
    return `<div class="filters" style="margin-top:0"><div class="seg">${btn("all", "Alle")}${btn("failed", "Fehlversuche")}${btn("logins", "Anmeldungen")}${btn("accounts", "Konten & Tokens")}</div></div>
      <div class="card" style="margin-top:12px;padding:6px 10px"><div class="table-wrap" style="margin:0"><table>
        <thead><tr><th>Zeit</th><th>Ereignis</th><th>Benutzer</th><th>IP</th><th class="hide-sm">Ort / Details</th></tr></thead><tbody>
        ${evs.length ? evs.map((e) => {
          const det = [e.geo, e.detail && e.detail.name, e.detail && e.detail.count ? `${e.detail.count}×` : ""].filter(Boolean).join(" · ");
          return `<tr><td class="muted" style="white-space:nowrap">${esc(dateTime(e.ts))}</td>
            <td><span class="log-ev" style="--c:${SEC_COLOR[e.type] || "var(--idle)"}"><i></i>${esc(SEC_LABELS[e.type] || e.type)}</span></td>
            <td>${esc(e.user || "–")}</td><td class="mono">${esc(e.ip || "–")}</td><td class="hide-sm">${esc(det)}</td></tr>`;
        }).join("") : `<tr><td colspan="5" class="muted">Keine Ereignisse.</td></tr>`}
        </tbody></table></div>
        ${all.length > evs.length ? `<div style="padding:10px;text-align:center"><button class="link-btn" data-secmore>Weitere ${Math.min(50, all.length - evs.length)} von ${all.length - evs.length} anzeigen</button></div>` : ""}</div>`;
  }

  function blockedCard(d, s) {
    const rows = (d.blocked || []).slice(0, 20);
    return `<section class="card"><div class="chart-title">Vom Worker gesperrte IPs</div>
      <div class="muted small">Zu viele abgewiesene Zugriffe (falsche Signatur, Token oder Login-Umgehung). ${s.workerAttempts} abgewiesene Zugriffe im Zeitraum.</div>
      ${rows.length ? `<div class="table-wrap"><table><thead><tr><th>IP</th><th>Grund</th><th class="num">Versuche</th><th>Gesperrt</th></tr></thead><tbody>
        ${rows.map((b) => `<tr><td class="mono">${esc(b.ip)}${b.country ? ` <span class="muted">· ${esc(b.country)}</span>` : ""}</td>
          <td>${esc(String(b.reason || "").split(",").map((k) => ATTACK_KIND[k] || k).join(", "))}</td><td class="num">${b.n || ""}</td>
          <td>${b.until > d.now ? `<span class="chip" style="--c:var(--critical)">bis ${esc(dateTime(b.until))}</span>` : `<span class="muted">${esc(dateTime(b.ts))}</span>`}</td></tr>`).join("")}
        </tbody></table></div>` : `<div class="muted" style="margin-top:14px">Keine Sperren.</div>`}</section>`;
  }

  function renderSecurity(d) {
    const s = analyseSecurity(d);
    const sec = d.security;
    const maxDay = niceMax(Math.max(1, ...s.days.map((r) => r.ha + r.worker)));
    const opts = { max: maxDay, ticks: [0, maxDay / 4, maxDay / 2, (3 * maxDay) / 4, maxDay].map((v) => Math.round(v * 100) / 100), tick: (t) => String(t), label: "Fehlversuche pro Tag" };
    return {
      html: `
        ${securityHero(sec)}
        ${rangeRow(d)}
        <div class="tiles">
          ${tile("Fehlversuche", String(s.failed), sec ? `${sec.failed_24h} in den letzten 24 h` : "", s.failed > 0)}
          ${tile("Anmeldungen", String(s.logins), s.newIps ? `${s.newIps} von neuen IPs` : "keine neuen IPs")}
          ${tile("Gesperrt", String(s.banned), s.brute ? `${s.brute}× Brute-Force-Verdacht` : "von HA und Bastion", s.brute > 0)}
          ${tile("Konten & Tokens", String(s.accounts), "Änderungen im Zeitraum")}
          ${tile("Worker", String(s.workerAttempts), s.blockedActive.length ? `${s.blockedActive.length} IP gesperrt` : "abgewiesene Zugriffe", s.workerAttempts > 0)}
        </div>
        <div class="grid2" style="margin-top:14px">
          ${stackCard({ id: "failed-chart", title: "Fehlversuche pro Tag", sub: "", rows: s.days, series: SEC_SERIES, fmt: (n) => String(n), showTable: view.secTable, toggle: "sec" })}
          ${sourcesCard(s)}
        </div>
        <div class="grid2" style="margin-top:14px">${findingsCard(sec)}${blockedCard(d, s)}</div>
        <h2>Anmeldungen und Konten</h2>
        ${secLogView(d, view.secLog)}`,
      bind: () => bindStack("failed-chart", s.days, SEC_SERIES, opts, (n) => String(n)),
    };
  }

  function rangeRow(d) {
    const range = (n, l) => `<button class="${view.days === n ? "on" : ""}" data-days="${n}">${l}</button>`;
    return `<div class="filters"><div class="seg">${range(7, "7 Tage")}${range(30, "30 Tage")}${range(90, "90 Tage")}${range(365, "1 Jahr")}</div>
      <span class="grow"></span><span class="muted small">Stand ${esc(timeOnly(d.now))}</span></div>`;
  }

  // ---------------------------------------------------------- dashboard
  const view = { days: 30, table: false, log: "all", logLimit: 25, secTable: false, secLog: "all", secLimit: 25, data: null };

  async function loadDashboard() {
    try {
      view.data = await api(`/api/summary?days=${view.days}`);
      TZ = (view.data.hb && view.data.hb.tz) || TZ;
      document.getElementById("instance").textContent = (view.data.hb && view.data.hb.instance) || "Alarmanlage";
      document.getElementById("who").textContent = view.data.user || "";
      renderDashboard();
    } catch (err) {
      app.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }

  function renderDashboard() {
    const d = view.data;
    const tab = location.hash === "#sicherheit" ? "security" : "alarm";
    const tabs = `<nav class="dtabs" aria-label="Bereiche"><a href="#" class="${tab === "alarm" ? "on" : ""}" data-tab="alarm">Alarmanlage</a><a href="#sicherheit" class="${tab === "security" ? "on" : ""}" data-tab="security">Sicherheit</a></nav>`;
    let bind = () => {};
    if (tab === "security") {
      const sec = renderSecurity(d);
      app.innerHTML = tabs + sec.html;
      bind = sec.bind;
    } else {
      const a = analyse(d);
      const k = a.kpi;
      app.innerHTML = `${tabs}
        ${heroView(d)}
        ${rangeRow(d)}
        <div class="tiles">
          ${tile("Alarme", String(k.alarms), k.acked ? `${k.acked} quittiert` : "", k.alarms > 0)}
          ${tile("Vorwarnungen", String(k.pending), `${k.defused} rechtzeitig entschärft`)}
          ${tile("Scharf", `${Math.round(k.armedShare * 100)} %`, "der Zeit im Zeitraum")}
          ${tile("Quittierzeit", k.ackMedian == null ? "–" : duration(k.ackMedian), "Median bis zur Bestätigung")}
          ${tile("Funkstille", String(k.outages), k.outageSec ? `insgesamt ${duration(k.outageSec)}` : "keine Ausfälle", k.outages > 0)}
          ${tile("Falsche Codes", String(k.wrong), k.shots ? `${k.shots} Kamerabilder gespeichert` : "")}
        </div>
        <div class="grid2" style="margin-top:14px">${stackCard({ id: "armed-chart", title: "Scharf-Zeit pro Tag", rows: a.days, series: MODE_SERIES, totals: a.totals, fmt: hours, showTable: view.table, toggle: "armed" })}${triggersCard(a)}</div>
        <h2>Vorfälle</h2>
        ${a.incidents.length ? `<div class="incidents">${a.incidents.slice(0, 24).map(incidentCard).join("")}</div>` : `<div class="card muted">Keine Vorfälle im Zeitraum.</div>`}
        <h2>Protokoll</h2>
        ${logView(d, view.log)}`;
      bind = () => bindStack("armed-chart", a.days, MODE_SERIES, ARMED_OPTS, hours);
    }
    bind();
    app.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => { view.days = Number(b.dataset.days); loadDashboard(); }));
    app.querySelectorAll("[data-log]").forEach((b) => b.addEventListener("click", () => { view.log = b.dataset.log; view.logLimit = 25; renderDashboard(); }));
    app.querySelectorAll("[data-seclog]").forEach((b) => b.addEventListener("click", () => { view.secLog = b.dataset.seclog; view.secLimit = 25; renderDashboard(); }));
    app.querySelectorAll("[data-toggle-table]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.toggleTable === "sec") view.secTable = !view.secTable;
      else view.table = !view.table;
      renderDashboard();
    }));
    const more = app.querySelector("[data-more]");
    if (more) more.addEventListener("click", () => { view.logLimit += 50; renderDashboard(); });
    const secMore = app.querySelector("[data-secmore]");
    if (secMore) secMore.addEventListener("click", () => { view.secLimit += 50; renderDashboard(); });
  }

  // ------------------------------------------------------------ incident
  async function loadIncident(id, token) {
    const q = token ? `?t=${encodeURIComponent(token)}` : "";
    try {
      const d = await api(`/api/incident/${id}${q}`);
      TZ = d.tz || TZ;
      if (d.instance) document.getElementById("instance").textContent = d.instance;
      renderIncident(d, token);
    } catch (err) {
      app.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }

  function renderIncident(d, token) {
    const ev = d.events;
    const trig = ev.find((e) => e.event === "triggered");
    const first = ev.find((e) => e.event === "pending" || e.event === "triggered") || ev[0];
    const color = trig ? "var(--critical)" : "var(--warning)";
    const start = ev.length ? ev[0].ts : null;
    app.innerHTML = `
      ${token ? "" : `<p style="margin:20px 0 0"><a href="/">← Dashboard</a></p>`}
      <h1>${esc(first ? where(first) || LABELS[first.event] : "Vorfall")}</h1>
      <div class="chips"><span class="chip" style="--c:${color}">${trig ? "Alarm" : "Vorwarnung"}</span>${start ? `<span class="muted">${esc(fmt(start, { weekday: "long", day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }))}</span>` : ""}</div>
      <h2>Ablauf</h2>
      <section class="card"><ul class="timeline">${ev.map((e) => `<li style="--c:${EV_COLOR[e.event] || "var(--idle)"}"><span class="t">${esc(timeOnly(e.ts))}</span><span class="d"></span>
        <span><b>${esc(LABELS[e.event] || e.event)}</b>${where(e) ? ` · ${esc(where(e))}` : ""}${e.user ? ` · ${esc(e.user)}` : ""}${e.mode && MODES[e.mode] && e.event !== "acknowledged" ? ` <span class="muted">· ${MODES[e.mode]}</span>` : ""}</span></li>`).join("") || `<li class="muted">Keine Ereignisse.</li>`}</ul></section>
      <h2>Kamerabilder</h2>
      ${d.snapshots.length ? `<div class="gallery">${d.snapshots.map((s) => `<figure class="shot" data-shot="${s.id}"><div class="ph">lädt …</div>
        <figcaption><span>${esc(s.camera || "Kamera")}</span><span class="grow"></span><span>${esc(timeOnly(s.ts))}</span></figcaption></figure>`).join("")}</div>`
        : `<div class="card muted">Keine Kamerabilder zu diesem Vorfall.</div>`}`;
    loadShots(d, token);
  }

  async function loadShots(d, token) {
    for (const s of d.snapshots) {
      const fig = app.querySelector(`[data-shot="${s.id}"]`);
      if (!fig) continue;
      try {
        const q = new URLSearchParams({ i: d.incident });
        if (token) q.set("t", token);
        const img = await api(`/api/img/${s.id}?${q}`);
        const el = document.createElement("img");
        el.alt = `${img.camera || "Kamera"} ${timeOnly(img.ts)}`;
        el.src = `data:${img.type};base64,${img.data}`;
        fig.querySelector(".ph").replaceWith(el);
        fig.addEventListener("click", () => {
          const box = document.createElement("div");
          box.className = "lightbox";
          box.innerHTML = `<img alt="" src="${el.src}">`;
          box.addEventListener("click", () => box.remove());
          document.body.appendChild(box);
        });
      } catch {
        fig.querySelector(".ph").textContent = "nicht verfügbar";
      }
    }
  }

  // -------------------------------------------------------------- route
  const m = location.pathname.match(/^\/i\/([a-f0-9]{8,32})$/);
  if (m) {
    const token = new URLSearchParams(location.search).get("t") || "";
    loadIncident(m[1], token);
  } else {
    loadDashboard();
    setInterval(() => { if (!document.hidden) loadDashboard(); }, 60000);
    let resizeTimer = null;
    window.addEventListener("hashchange", () => { if (view.data) renderDashboard(); });
    window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (view.data && !view.table) renderDashboard(); }, 150); });
  }
})();
</script>
</body>
</html>
