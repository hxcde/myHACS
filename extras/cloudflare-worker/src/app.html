<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c1f" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Bastion">
<meta name="application-name" content="Bastion">
<link rel="manifest" href="/manifest.webmanifest" crossorigin="use-credentials">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>Bastion</title>
<style>
/* Bastion – im Controller-Design von Argus: flach, klare Kanten, hoher Kontrast, ein Akzent (Blau). */
:root {
  color-scheme: light dark;
  --bg: #eef0f3; --panel: #ffffff; --panel-2: #f8f9fa; --chip-bg: #eef0f2; --hover: #f4f5f7; --active: #eaf2ff;
  --border: #e2e4e8; --border-strong: #d2d5da; --hairline: rgb(16 24 40 / 8%);
  --text: #14161a; --text-2: #5c6067; --text-3: #868a91;
  --primary: #006fff; --primary-hover: #005fe0; --primary-soft: #e8f1ff;
  --green: #18a957; --green-soft: #e7f6ee; --red: #e5383b; --red-soft: #fdecec; --orange: #e8930c; --orange-soft: #fdf3e2;
  --violet: #6e56cf; --violet-soft: #f0edfb; --gray: #a1a8b2;
  --pop-shadow: 0 10px 32px rgb(16 24 40 / 14%), 0 2px 6px rgb(16 24 40 / 6%);
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
  --radius: 10px; --radius-s: 6px; --ease: cubic-bezier(.2, .7, .2, 1); --t-fast: 120ms; --t: 200ms;
  --h: 32px; --h-in: 28px;
  font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
  font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; -webkit-tap-highlight-color: transparent;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1012; --panel: #1b1c1f; --panel-2: #202125; --chip-bg: #27282c; --hover: #232428; --active: #27292d;
    --border: #2a2b30; --border-strong: #393b41; --hairline: rgb(255 255 255 / 7%);
    --text: #f6f7f8; --text-2: #a4a8af; --text-3: #72767d;
    --primary: #4593fc; --primary-hover: #64a6ff; --primary-soft: rgb(69 147 252 / 16%);
    --green: #2fbf6c; --green-soft: rgb(47 191 108 / 13%); --red: #f2555a; --red-soft: rgb(242 85 90 / 13%);
    --orange: #f2a93b; --orange-soft: rgb(242 169 59 / 13%); --violet: #9b87f5; --violet-soft: rgb(155 135 245 / 14%); --gray: #5f666f;
    --pop-shadow: 0 12px 36px rgb(0 0 0 / 55%);
    --s1: #3987e5; --s2: #d95926; --s3: #199e70;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f1012; --panel: #1b1c1f; --panel-2: #202125; --chip-bg: #27282c; --hover: #232428; --active: #27292d;
  --border: #2a2b30; --border-strong: #393b41; --hairline: rgb(255 255 255 / 7%);
  --text: #f6f7f8; --text-2: #a4a8af; --text-3: #72767d;
  --primary: #4593fc; --primary-hover: #64a6ff; --primary-soft: rgb(69 147 252 / 16%);
  --green: #2fbf6c; --green-soft: rgb(47 191 108 / 13%); --red: #f2555a; --red-soft: rgb(242 85 90 / 13%);
  --orange: #f2a93b; --orange-soft: rgb(242 169 59 / 13%); --violet: #9b87f5; --violet-soft: rgb(155 135 245 / 14%); --gray: #5f666f;
  --pop-shadow: 0 12px 36px rgb(0 0 0 / 55%);
  --s1: #3987e5; --s2: #d95926; --s3: #199e70;
}
:root[data-theme="light"] { color-scheme: light; }
/* Statusnamen, die die Auswertung verwendet */
:root { --good: var(--green); --warning: var(--orange); --serious: #f97316; --critical: var(--red); --idle: var(--gray); --muted: var(--text-2); --accent: var(--primary); }

html, body { margin: 0; background: var(--bg); color: var(--text); }
html { scrollbar-gutter: stable; }
body { overflow-x: hidden; }
* { box-sizing: border-box; }
a { color: var(--primary); text-decoration: none; }
a:hover { text-decoration: underline; }
h1, h2, h3, p { margin: 0; }
button { font: inherit; color: inherit; }
.mono { font-family: ui-monospace, "SF Mono", SFMono-Regular, Menlo, Consolas, monospace; font-size: .9em; }
svg.icon { width: 18px; height: 18px; flex: none; stroke: currentColor; fill: none; stroke-width: 1.75; stroke-linecap: round; stroke-linejoin: round; }
.muted { color: var(--text-2); }
.faint { color: var(--text-3); }
.small { font-size: 12px; }
.grow { flex: 1; min-width: 0; }
.hide-sm { }

/* ---------- Shell ---------- */
.sidebar { position: fixed; inset: 0 auto 0 0; width: 216px; z-index: 30; background: var(--panel); border-right: 1px solid var(--border);
  display: flex; flex-direction: column; padding: 12px 10px; gap: 2px; }
.brand { display: flex; align-items: center; gap: 10px; height: 40px; padding: 0 8px; margin-bottom: 10px; color: var(--text); font-weight: 600; font-size: 15px; letter-spacing: -.01em; }
.brand:hover { text-decoration: none; }
.brand svg { width: 26px; height: 26px; flex: none; }
.nav-section { font-size: 11px; font-weight: 600; color: var(--text-3); padding: 12px 10px 6px; text-transform: uppercase; letter-spacing: .04em; }
.sidebar nav { display: flex; flex-direction: column; gap: 2px; }
.side-link { position: relative; display: flex; align-items: center; gap: 11px; height: 36px; padding: 0 10px; border-radius: var(--radius-s); color: var(--text);
  font-weight: 500; font-size: 13px; transition: background var(--t-fast) var(--ease), color var(--t-fast) var(--ease); }
.side-link svg.icon { width: 20px; height: 20px; color: var(--primary); }
.side-link:hover { background: var(--hover); text-decoration: none; }
.side-link.active { background: var(--active); font-weight: 600; }
.side-link.active::before { content: ""; position: absolute; left: -10px; top: 8px; bottom: 8px; width: 3px; border-radius: 0 3px 3px 0; background: var(--primary); }
.side-link .short, .side-link .tip { display: none; }
.side-link .badge { margin-left: auto; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--red); color: #fff;
  font-size: 11px; font-weight: 700; display: inline-grid; place-items: center; font-variant-numeric: tabular-nums; }
.side-link .badge:empty { display: none; }
.sidebar .spacer { flex: 1; }
.side-user { display: flex; align-items: center; gap: 10px; padding: 12px 8px 4px; border-top: 1px solid var(--border); margin-top: 8px; min-width: 0; }
.side-user .email { font-size: 12px; color: var(--text-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.avatar { width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; flex: none; background: var(--primary); color: #fff; font-weight: 600; font-size: 12px; }
.shell { margin-left: 216px; min-height: 100vh; min-height: 100dvh; min-width: 0; }
body.bare .sidebar { display: none; }
body.bare .shell { margin-left: 0; }
.header { position: sticky; top: 0; z-index: 20; height: calc(56px + env(safe-area-inset-top)); display: flex; align-items: center; gap: 16px;
  padding: env(safe-area-inset-top) max(24px, env(safe-area-inset-right)) 0 24px; background: var(--panel); border-bottom: 1px solid var(--border); }
.sidebar { padding-top: max(12px, env(safe-area-inset-top)); }
@media (display-mode: standalone) { body { -webkit-user-select: none; user-select: none; } td, .msg, .pname, .mono { -webkit-user-select: text; user-select: text; } }
.crumbs { display: flex; align-items: center; gap: 6px; min-width: 0; font-size: 15px; flex: 1; }
.crumbs a, .crumbs .root { color: var(--text-2); font-weight: 500; white-space: nowrap; }
.crumbs .sep { color: var(--text-3); }
.crumbs h1 { font-size: 15px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.header .right { display: flex; align-items: center; gap: 8px; flex: none; }
.updated { color: var(--text-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; }
main { padding: 20px 24px 48px; max-width: 1280px; min-width: 0; margin-inline: auto; }

/* ---------- Layout ---------- */
.row { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; min-width: 0; }
.spread { justify-content: space-between; }
.grid { display: grid; gap: 16px; }
.grid > * { min-width: 0; }
.grid.kpis { grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); }
.grid.two { grid-template-columns: minmax(0, 1.45fr) minmax(0, 1fr); }
.grid.even { grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); }
.mt { margin-top: 16px; }
.card { background: var(--panel); border: 1px solid var(--border); border-radius: var(--radius); min-width: 0; }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 16px; min-height: 48px; border-bottom: 1px solid var(--border); }
.card-head h2 { font-size: 14px; font-weight: 600; }
.card-head .sub { font-size: 12px; color: var(--text-2); font-weight: 400; margin-top: 1px; }
.card-body { padding: 16px; }
.card-body.flush { padding: 0; }
.section-title { font-size: 13px; font-weight: 600; color: var(--text-2); margin: 24px 0 10px; }

/* Kennzahlen */
.kpi { padding: 14px 16px; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.kpi .label { font-size: 12px; font-weight: 500; color: var(--text-2); display: flex; align-items: center; gap: 6px; }
.kpi .label svg.icon { width: 15px; height: 15px; color: var(--primary); }
.kpi .value { font-size: 24px; font-weight: 650; letter-spacing: -.025em; line-height: 1.2; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.kpi .value.bad { color: var(--red); }
.kpi .sub { font-size: 12px; color: var(--text-3); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Status */
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; background: var(--c, var(--gray)); display: inline-block; }
.tag { display: inline-flex; align-items: center; gap: 6px; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 500; background: var(--chip-bg); color: var(--text); white-space: nowrap; }
.tag.dotted::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--gray)); flex: none; }
.pill { display: inline-flex; align-items: center; gap: 5px; height: 24px; padding: 0 9px; border-radius: 6px; max-width: 100%; background: var(--chip-bg); color: var(--text);
  font-size: 12px; font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.pill.ok { background: var(--green-soft); color: var(--green); font-weight: 600; }
.pill.warn { background: var(--orange-soft); color: var(--orange); font-weight: 600; }
.pill.bad { background: var(--red-soft); color: var(--red); font-weight: 600; }
.pills { display: flex; flex-wrap: wrap; gap: 6px; }

/* Statusbereich mit Farbkugel */
.hero { padding: 16px 20px 14px; background: linear-gradient(135deg, color-mix(in srgb, var(--hero-c) 10%, var(--panel)) 0%, var(--panel) 60%); }
.hero-ok { --hero-c: var(--green); } .hero-warn { --hero-c: var(--orange); } .hero-down { --hero-c: var(--red); } .hero-maint { --hero-c: var(--violet); } .hero-idle { --hero-c: var(--gray); }
.hero-top { display: flex; align-items: center; gap: 16px; min-width: 0; }
.hero-text { min-width: 0; flex: 1; }
.hero-text h2 { font-size: 18px; font-weight: 700; letter-spacing: -.015em; line-height: 1.3; }
.hero-text p { color: var(--text-2); margin-top: 2px; font-size: 12px; }
.hero-stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--border); }
.hstat { display: flex; flex-direction: column; gap: 1px; padding: 0 16px; min-width: 0; }
.hstat:first-child { padding-left: 0; }
.hstat + .hstat { border-left: 1px solid var(--border); }
.hv { font-size: 18px; font-weight: 650; letter-spacing: -.015em; font-variant-numeric: tabular-nums; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hv.bad { color: var(--red); } .hv.warn { color: var(--orange); } .hv.ok { color: var(--green); }
.hl { font-size: 11px; color: var(--text-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.orb { position: relative; isolation: isolate; overflow: hidden; flex: none; display: grid; place-items: center; width: 46px; height: 46px; border-radius: 50%; color: #fff;
  background: radial-gradient(circle at 50% 60%, var(--orb-a), var(--orb-z));
  box-shadow: inset 0 0 0 .5px rgb(255 255 255 / 14%), 0 2px 12px -3px color-mix(in srgb, var(--orb-c) 50%, transparent); animation: orb-glow 5s ease-in-out infinite; }
.orb-ok { --orb-a: #0e6b3c; --orb-z: #08391f; --c1: #3ee08f; --c2: #2ad4e6; --c3: #b6ec4c; --orb-c: #2fbf6c; }
.orb-warn { --orb-a: #7a4706; --orb-z: #3d2402; --c1: #ffb547; --c2: #ffd166; --c3: #ff8a3d; --orb-c: #f2a93b; }
.orb-down { --orb-a: #7a1418; --orb-z: #3b0709; --c1: #ff5a5f; --c2: #ff8f6b; --c3: #ff3d7f; --orb-c: #f2555a; }
.orb-maint { --orb-a: #3b2a85; --orb-z: #1c1440; --c1: #9b87f5; --c2: #6aa6ff; --c3: #c58af9; --orb-c: #9b87f5; }
.orb-idle { --orb-a: #3a3d44; --orb-z: #1e2024; --c1: #9aa1ab; --c2: #6b7280; --c3: #c0c6cf; --orb-c: #8f949b; }
.orb-in { position: absolute; inset: 0; animation: orb-spin 14s linear infinite; }
.orb-b { position: absolute; width: 78%; height: 78%; border-radius: 50%; filter: blur(5px); mix-blend-mode: screen; }
.orb-b.b1 { left: -8%; top: -6%; background: radial-gradient(circle, var(--c1) 0%, transparent 68%); animation: orb-1 5.6s ease-in-out infinite; }
.orb-b.b2 { right: -12%; top: 12%; background: radial-gradient(circle, var(--c2) 0%, transparent 68%); animation: orb-2 7.2s ease-in-out infinite; }
.orb-b.b3 { left: 12%; bottom: -16%; background: radial-gradient(circle, var(--c3) 0%, transparent 66%); animation: orb-3 6.4s ease-in-out infinite; }
.orb svg.icon { position: relative; z-index: 1; width: 21px; height: 21px; stroke-width: 2.4; filter: drop-shadow(0 1px 2px rgb(0 0 0 / 30%)); }
.orb-lg { width: 58px; height: 58px; }
.orb-lg .orb-b { filter: blur(6px); }
.orb-lg svg.icon { width: 26px; height: 26px; stroke-width: 2.2; }
@keyframes orb-spin { to { transform: rotate(360deg); } }
@keyframes orb-1 { 0%, 100% { transform: translate(0, 0) scale(1); } 50% { transform: translate(34%, 30%) scale(1.18); } }
@keyframes orb-2 { 0%, 100% { transform: translate(0, 0) scale(1.06); } 50% { transform: translate(-42%, 24%) scale(.84); } }
@keyframes orb-3 { 0%, 100% { transform: translate(0, 0) scale(.92); } 50% { transform: translate(22%, -46%) scale(1.22); } }
@keyframes orb-glow {
  0%, 100% { box-shadow: inset 0 0 0 .5px rgb(255 255 255 / 14%), 0 2px 10px -4px color-mix(in srgb, var(--orb-c) 40%, transparent); }
  50% { box-shadow: inset 0 0 0 .5px rgb(255 255 255 / 14%), 0 2px 16px -3px color-mix(in srgb, var(--orb-c) 58%, transparent); }
}

/* Hinweise */
.problem { display: flex; align-items: flex-start; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); color: var(--text); }
.problem:last-child { border-bottom: 0; }
.problem .dot { margin-top: 6px; }
.problem .pname { font-weight: 600; }
.problem .msg { color: var(--text-2); font-size: 12px; overflow-wrap: anywhere; }
.problem .since { margin-left: auto; color: var(--text-3); font-size: 12px; white-space: nowrap; font-variant-numeric: tabular-nums; padding-left: 8px; }

/* Buttons und Filter */
.btn { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 6px; height: var(--h); padding: 0 12px; border-radius: var(--radius-s);
  border: 1px solid var(--border-strong); background: var(--panel); color: var(--text); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap;
  transition: background var(--t-fast) var(--ease), transform var(--t-fast) var(--ease); }
.btn:hover { background: var(--hover); text-decoration: none; }
.btn:active { transform: scale(.98); }
.btn.icon-only { width: var(--h); padding: 0; }
.btn.sm { height: var(--h-in); padding: 0 10px; font-size: 12px; }
:focus-visible { outline: 2px solid var(--primary); outline-offset: 2px; }
.seg { display: inline-flex; padding: 2px; border-radius: 8px; background: var(--chip-bg); max-width: 100%; overflow-x: auto; scrollbar-width: none; }
.seg::-webkit-scrollbar { display: none; }
.seg button { border: 0; background: transparent; color: var(--text-2); height: var(--h-in); padding: 0 12px; border-radius: 6px; font-size: 12px; font-weight: 500;
  cursor: pointer; white-space: nowrap; flex: none; transition: color var(--t-fast) var(--ease); }
.seg button:hover { color: var(--text); }
.seg button.active { color: var(--text); font-weight: 600; background: var(--panel); box-shadow: 0 0 0 1px var(--border-strong); }
.toolbar { display: flex; align-items: center; gap: 12px; padding: 12px 16px; border-bottom: 1px solid var(--border); flex-wrap: wrap; }

/* Tabellen */
.table-wrap { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13px; }
th { text-align: left; font-weight: 500; font-size: 12px; color: var(--text-2); padding: 0 12px; height: 38px; border-bottom: 1px solid var(--border); white-space: nowrap; background: var(--panel-2); }
td { padding: 0 12px; height: 48px; border-bottom: 1px solid var(--border); vertical-align: middle; }
td.msg { padding-top: 10px; padding-bottom: 10px; overflow-wrap: anywhere; }
tbody tr:last-child td { border-bottom: 0; }
tbody tr { transition: background var(--t-fast) var(--ease); }
tbody tr.link { cursor: pointer; }
tbody tr.link:hover td { background: var(--hover); }
th:first-child, td:first-child { padding-left: 16px; }
th:last-child, td:last-child { padding-right: 16px; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.t { color: var(--text-2); white-space: nowrap; font-variant-numeric: tabular-nums; }
td .name { font-weight: 600; }
.more { padding: 10px; text-align: center; border-top: 1px solid var(--border); }
.empty { padding: 32px 16px; text-align: center; color: var(--text-2); }

/* Balken und Diagramme */
.bars { display: grid; gap: 12px; padding: 16px; }
.bar-row { display: grid; grid-template-columns: minmax(0, 40%) minmax(0, 1fr) 44px; align-items: center; gap: 12px; font-size: 13px; }
.bar-row .label { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-weight: 500; }
.bar-track { display: flex; gap: 2px; height: 6px; background: var(--chip-bg); border-radius: 3px; overflow: hidden; }
.bar-fill { height: 100%; background: var(--c, var(--primary)); border-radius: 3px; }
.bar-row .val { text-align: right; color: var(--text-2); font-variant-numeric: tabular-nums; }
.chart-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--text-2); }
.chart-legend .sw { display: inline-block; width: 10px; height: 10px; border-radius: 3px; vertical-align: -1px; margin-right: 6px; }
.chart-legend b { color: var(--text); font-weight: 600; margin-left: 4px; font-variant-numeric: tabular-nums; }
.chart { position: relative; margin-top: 12px; }
.chart svg { display: block; overflow: visible; }
.chart .grid line { stroke: var(--border); stroke-width: 1; }
.chart .axis text { fill: var(--text-3); font-size: 11px; font-family: inherit; }
.chart .hit { fill: transparent; }
.chart .hit:hover { fill: var(--hover); fill-opacity: .6; }
.tip { position: absolute; pointer-events: none; z-index: 5; min-width: 150px; max-width: 260px; padding: 8px 11px; border-radius: 8px; background: var(--panel);
  border: 1px solid var(--border-strong); box-shadow: var(--pop-shadow); font-size: 12px; line-height: 1.5; transform: translate(-50%, calc(-100% - 10px)); }
.tip-row { display: flex; align-items: center; gap: 8px; }
.tip-row i { width: 9px; height: 9px; border-radius: 3px; }
.tip-row b { margin-left: auto; font-variant-numeric: tabular-nums; }

/* Vorfall */
.timeline { list-style: none; margin: 0; padding: 0; }
.timeline li { display: grid; grid-template-columns: 76px 16px 1fr; gap: 10px; align-items: start; padding: 10px 16px; border-bottom: 1px solid var(--border); }
.timeline li:last-child { border-bottom: 0; }
.timeline .t { color: var(--text-2); font-variant-numeric: tabular-nums; font-size: 13px; }
.timeline .dot { margin-top: 5px; }
.gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 12px; padding: 16px; }
.shot { margin: 0; border-radius: var(--radius-s); overflow: hidden; background: var(--chip-bg); border: 1px solid var(--border); cursor: zoom-in; }
.shot .ph { aspect-ratio: 16 / 9; display: grid; place-items: center; color: var(--text-3); font-size: 12px; }
.shot img { display: block; width: 100%; height: auto; }
.shot figcaption { padding: 8px 10px; font-size: 12px; color: var(--text-2); display: flex; gap: 8px; }
.lightbox { position: fixed; inset: 0; z-index: 60; background: rgb(0 0 0 / 85%); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.lightbox img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.loading, .error { padding: 80px 0; text-align: center; color: var(--text-2); }

/* Fernsteuerung */
.btn.primary { background: var(--primary); border-color: var(--primary); color: #fff; }
.btn.primary:hover { background: var(--primary-hover); }
.btn[disabled] { opacity: .5; cursor: not-allowed; transform: none; }
.input { height: var(--h); padding: 0 10px; border: 1px solid var(--border-strong); border-radius: var(--radius-s); background: var(--panel); color: var(--text);
  font: inherit; font-size: 16px; min-width: 0; letter-spacing: .08em; font-variant-numeric: tabular-nums; }
.ctl-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(120px, 1fr)); gap: 8px; }
.btn.ctl { flex-direction: column; height: auto; padding: 14px 8px 12px; gap: 4px; font-weight: 600; }
.btn.ctl svg.icon { width: 22px; height: 22px; color: var(--primary); }
.btn.ctl small { font-weight: 400; color: var(--text-2); font-size: 11px; }
.btn.ctl.current { border-color: var(--primary); box-shadow: inset 0 0 0 1px var(--primary); background: var(--primary-soft); }
.notice { margin-top: 12px; padding: 10px 12px; border-radius: var(--radius-s); background: var(--panel-2); border: 1px solid var(--border); font-size: 13px; line-height: 1.5; }
.notice.ok { background: var(--green-soft); border-color: transparent; }
.notice.warn { background: var(--orange-soft); border-color: transparent; }
.notice.bad { background: var(--red-soft); border-color: transparent; }
.notice .btn { margin: 6px 6px 0 0; }
.stack { display: grid; gap: 10px; }

/* Verfügbarkeit */
.strip { display: grid; grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); gap: 2px; height: 34px; }
.strip i { border-radius: 2px; background: var(--c, var(--chip-bg)); }
.strip i:hover { outline: 2px solid var(--text); outline-offset: 1px; }
.strip-axis { display: flex; justify-content: space-between; font-size: 11px; color: var(--text-3); margin-top: 6px; }
.chart-legend.mt8 { margin-top: 10px; }

/* ---------- Responsive ---------- */
@media (max-width: 1100px) {
  .sidebar { width: 60px; padding: 12px 8px; align-items: center; }
  .brand { padding: 0; justify-content: center; }
  .brand span, .side-link .label, .side-user .email, .nav-section { display: none; }
  .side-link { width: 44px; height: 40px; justify-content: center; padding: 0; }
  .side-link.active::before { left: -8px; }
  .side-link .badge { position: absolute; top: 3px; right: 2px; margin: 0; }
  .shell { margin-left: 60px; }
}
@media (max-width: 900px) { .grid.two, .grid.even { grid-template-columns: minmax(0, 1fr); } .hide-md { display: none; } }
@media (max-width: 640px) {
  :root { font-size: 15px; --radius: 14px; }
  .sidebar { inset: auto 0 0 0; width: auto; height: calc(58px + env(safe-area-inset-bottom)); padding: 0 4px env(safe-area-inset-bottom); flex-direction: row; align-items: stretch;
    border-right: 0; border-top: 1px solid var(--border); background: color-mix(in srgb, var(--panel) 94%, transparent); backdrop-filter: blur(18px) saturate(160%); }
  .brand, .sidebar .spacer, .side-user, .nav-section { display: none; }
  .sidebar nav { flex-direction: row; gap: 0; width: 100%; }
  .side-link { flex: 1 1 0; flex-direction: column; justify-content: center; gap: 3px; width: auto; height: 58px; padding: 0; border-radius: 0; font-size: 10.5px; }
  .side-link .short { display: block; }
  .side-link svg.icon { width: 22px; height: 22px; }
  .side-link.active { background: transparent; color: var(--primary); }
  .side-link.active::before { left: 30%; right: 30%; top: 0; bottom: auto; width: auto; height: 2px; border-radius: 0 0 2px 2px; }
  .side-link .badge { position: absolute; top: 6px; left: calc(50% + 6px); right: auto; margin: 0; }
  .shell { margin-left: 0; padding-bottom: calc(58px + env(safe-area-inset-bottom)); }
  body.bare .shell { padding-bottom: 0; }
  .header { padding: env(safe-area-inset-top) 12px 0 16px; gap: 10px; }
  .sidebar { padding-top: 0; }
  .updated { display: none; }
  main { padding: 12px 12px 28px; }
  .hero-stats { grid-template-columns: repeat(2, minmax(0, 1fr)); row-gap: 10px; }
  .hstat:nth-child(3) { padding-left: 0; border-left: 0; }
  .hide-sm { display: none; }
  .bar-row { grid-template-columns: minmax(0, 1fr) 40px; }
  .grid.kpis { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; }
  .hero-top { flex-wrap: wrap; }
  .bar-row .bar-track { grid-column: 1 / -1; grid-row: 2; }
}
@media (prefers-reduced-motion: reduce) { *, *::before, *::after { animation: none !important; transition: none !important; } }

<body>
<aside class="sidebar" id="sidebar">
  <a class="brand" href="#"><svg viewBox="0 0 32 32" aria-hidden="true"><path d="M16 2.5 4.5 7v8.2c0 7 4.9 13.2 11.5 14.8 6.6-1.6 11.5-7.8 11.5-14.8V7L16 2.5Z" fill="var(--primary)"/><circle cx="16" cy="13.8" r="2.7" fill="#fff"/><path d="M14.7 15.2h2.6l.9 5.6h-4.4l.9-5.6Z" fill="#fff"/></svg><span>Bastion</span></a>
  <div class="nav-section">Überwachung</div>
  <nav>
    <a class="side-link" href="#" data-nav="alarm"><svg class="icon" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 9.5 4-1.2 7-5 7-9.5V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span class="label">Alarmanlage</span><span class="short">Alarm</span><span class="badge" id="badge-alarm"></span></a>
    <a class="side-link" href="#verfuegbarkeit" data-nav="uptime"><svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg><span class="label">Verfügbarkeit</span><span class="short">Betrieb</span><span class="badge" id="badge-up"></span></a>
    <a class="side-link" href="#sicherheit" data-nav="security"><svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg><span class="label">Sicherheit</span><span class="short">Sicherheit</span><span class="badge" id="badge-sec"></span></a>
  </nav>
  <div class="spacer"></div>
  <div class="side-user"><span class="avatar" id="avatar">B</span><span class="email" id="who"></span></div>
</aside>
<div class="shell">
  <header class="header">
    <div class="crumbs"><span class="root" id="instance">Bastion</span><span class="sep">/</span><h1 id="title">Übersicht</h1></div>
    <div class="right"><span class="updated" id="updated"></span><button class="btn icon-only" id="theme" aria-label="Darstellung wechseln"></button></div>
  </header>
  <main id="app"><div class="loading">Lädt …</div></main>
</div>
<script>
(() => {
  "use strict";
  const app = document.getElementById("app");
  const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
  const MODES = { home: "Zuhause", night: "Nacht", away: "Abwesend" };
  const MODE_KEYS = ["home", "night", "away"];
  const MODE_VAR = { home: "var(--s1)", night: "var(--s2)", away: "var(--s3)" };
  const LABELS = {
    triggered: "Alarm", pending: "Vorwarnung", arming: "Wird scharf", armed: "Scharf", rearmed: "Wieder scharf",
    disarmed: "Unscharf", reset: "Zurückgesetzt", arm_failed: "Scharfschalten fehlgeschlagen", wrong_code: "Falscher Code",
    sensor_unavailable: "Sensor nicht erreichbar", acknowledged: "Quittiert", offline: "Funkstille", online: "Wieder erreichbar", restart: "Neustart", attack: "Angriffsversuch am Worker",
    exposure: "Außenprüfung", canary: "Köder benutzt", passkey_added: "Passkey gekoppelt", passkey_removed: "Passkey entfernt", unarmed: "Niemand zuhause, nicht scharf",
  };
  const EV_COLOR = {
    triggered: "var(--critical)", pending: "var(--warning)", wrong_code: "var(--serious)", arm_failed: "var(--serious)",
    offline: "var(--serious)", sensor_unavailable: "var(--warning)", disarmed: "var(--good)", online: "var(--good)", acknowledged: "var(--good)",
    armed: "var(--accent)", arming: "var(--accent)", rearmed: "var(--accent)", attack: "var(--critical)", canary: "var(--critical)",
    passkey_added: "var(--warning)", passkey_removed: "var(--gray)", unarmed: "var(--warning)",
  };
  const GROUPS = {
    alarm: ["triggered", "pending", "acknowledged", "sensor_unavailable"],
    ops: ["armed", "arming", "rearmed", "disarmed", "reset", "arm_failed", "wrong_code", "unarmed"],
    system: ["offline", "online", "restart", "attack", "exposure", "canary", "passkey_added", "passkey_removed"],
  };
  let TZ = "Europe/Berlin";

  // ------------------------------------------------------------- theme
  // System, hell, dunkel (wie Argus); das System gilt ohne Attribut.
  const THEMES = ["system", "light", "dark"];
  let theme = "system";
  try { theme = localStorage.getItem("bastion-theme") || "system"; } catch { /* Speicher gesperrt */ }
  const ICON = {
    system: '<svg class="icon" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg>',
    light: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>',
    dark: '<svg class="icon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
    shield: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 9.5 4-1.2 7-5 7-9.5V6l-7-3Z"/><path d="m9 12 2 2 4-4"/></svg>',
    shieldOff: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3 5 6v5c0 4.5 3 8.3 7 9.5 4-1.2 7-5 7-9.5V6l-7-3Z"/></svg>',
    alert: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 4 2.5 20h19L12 4Z"/><path d="M12 10v4M12 17.5v.01"/></svg>',
    bell: '<svg class="icon" viewBox="0 0 24 24"><path d="M6 16V11a6 6 0 0 1 12 0v5l1.5 2h-15L6 16Z"/><path d="M10 20a2 2 0 0 0 4 0"/></svg>',
    clock: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    wifiOff: '<svg class="icon" viewBox="0 0 24 24"><path d="M2 8.5a15 15 0 0 1 4-2.4M9 5.2A15 15 0 0 1 22 8.5M5 12a10 10 0 0 1 3.3-2M12 9a10 10 0 0 1 7 3M8.5 15.5a5 5 0 0 1 7 0M12 19.5h.01M3 3l18 18"/></svg>',
    key: '<svg class="icon" viewBox="0 0 24 24"><circle cx="8" cy="15" r="4"/><path d="m11 12 9-9M17 6l3 3M14 9l2 2"/></svg>',
    lock: '<svg class="icon" viewBox="0 0 24 24"><rect x="5" y="11" width="14" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>',
    user: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="8" r="4"/><path d="M4 21a8 8 0 0 1 16 0"/></svg>',
    globe: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>',
    ban: '<svg class="icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m5.6 5.6 12.8 12.8"/></svg>',
    camera: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>',
    check: '<svg class="icon" viewBox="0 0 24 24"><path d="m5 12 5 5 9-10"/></svg>',
    back: '<svg class="icon" viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>',
    pulse: '<svg class="icon" viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg>',
    power: '<svg class="icon" viewBox="0 0 24 24"><path d="M12 3v8"/><path d="M6.3 6.8a8 8 0 1 0 11.4 0"/></svg>',
    moon: '<svg class="icon" viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>',
    home: '<svg class="icon" viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9h-5v-6H9v6H4z"/></svg>',
    bird: '<svg class="icon" viewBox="0 0 24 24"><path d="M16 7h.01M3.4 18H12a8 8 0 0 0 8-8V7a4 4 0 0 0-7.3-2.3L2 20"/><path d="m20 7 2 .5-2 .5M10 18v3M14 17.7V21"/></svg>',
  };
  const applyTheme = () => {
    if (theme === "light" || theme === "dark") document.documentElement.setAttribute("data-theme", theme);
    else document.documentElement.removeAttribute("data-theme");
    const btn = document.getElementById("theme");
    btn.innerHTML = ICON[theme] || ICON.system;
    btn.title = `Darstellung: ${{ system: "System", light: "Hell", dark: "Dunkel" }[theme] || "System"}`;
  };
  applyTheme();
  document.getElementById("theme").addEventListener("click", () => {
    theme = THEMES[(THEMES.indexOf(theme) + 1) % THEMES.length];
    try { localStorage.setItem("bastion-theme", theme); } catch { /* ignore */ }
    applyTheme();
  });

  // ------------------------------------------------------------ format
  const fmt = (ts, opts) => {
    try { return new Date(ts * 1000).toLocaleString("de-DE", { timeZone: TZ, ...opts }); }
    catch { return new Date(ts * 1000).toLocaleString("de-DE", opts); }
  };
  const dateTime = (ts) => fmt(ts, { day: "2-digit", month: "2-digit", hour: "2-digit", minute: "2-digit" });
  const timeOnly = (ts) => fmt(ts, { hour: "2-digit", minute: "2-digit", second: "2-digit" });
  const dayKey = (ts) => fmt(ts, { year: "numeric", month: "2-digit", day: "2-digit" });
  const dayShort = (ts) => fmt(ts, { day: "2-digit", month: "2-digit" });
  const weekday = (ts) => fmt(ts, { weekday: "short", day: "2-digit", month: "2-digit" });
  const secOfDay = (ts) => {
    const p = Object.fromEntries(new Intl.DateTimeFormat("en-GB", { timeZone: TZ, hour: "2-digit", minute: "2-digit", second: "2-digit", hourCycle: "h23" })
      .formatToParts(new Date(ts * 1000)).map((x) => [x.type, x.value]));
    return Number(p.hour) * 3600 + Number(p.minute) * 60 + Number(p.second);
  };
  const rel = (ts) => {
    const s = Math.max(0, Date.now() / 1000 - ts);
    if (s < 60) return "gerade eben";
    if (s < 3600) return `vor ${Math.round(s / 60)} Min.`;
    if (s < 86400) return `vor ${Math.round(s / 3600)} Std.`;
    return `vor ${Math.round(s / 86400)} T.`;
  };
  const hours = (s) => (s / 3600 >= 10 ? Math.round(s / 3600) : (s / 3600).toFixed(1).replace(".", ",")) + " h";
  const duration = (s) => {
    if (s < 60) return `${Math.round(s)} s`;
    if (s < 3600) return `${Math.round(s / 60)} Min.`;
    return `${Math.floor(s / 3600)} h ${Math.round((s % 3600) / 60)} Min.`;
  };
  const where = (e) => [e.sensor, e.room].filter(Boolean).join(" · ");
  const isArmed = (state) => Boolean(state && (state.startsWith("armed_") || state === "pending" || state === "triggered"));

  async function api(path) {
    let r;
    try {
      r = await fetch(path, { credentials: "same-origin", headers: { accept: "application/json" } });
    } catch {
      throw new Error("Keine Verbindung. Die Daten werden geladen, sobald das Gerät wieder online ist.");
    }
    if (!r.ok) throw new Error(r.status === 404 ? "Nicht gefunden oder keine Berechtigung." : `Fehler ${r.status}`);
    return r.json();
  }

  // --------------------------------------------------------- analysis
  function analyse(d) {
    const since = d.now - d.days * 86400;
    const end = d.hb && d.hb.offline ? Math.min(d.now, d.hb.received) : d.now;
    const perDay = new Map();
    for (let t = since; t <= d.now + 86400; t += 86400) perDay.set(dayKey(t), { key: dayKey(t), ts: t, home: 0, night: 0, away: 0 });
    const addSpan = (from, to, st) => {
      if (!st || !isArmed(st.state) || !MODES[st.mode]) return;
      let t = Math.max(from, since);
      while (t < to) {
        const next = Math.min(to, t - secOfDay(t) + 86400);
        const bucket = perDay.get(dayKey(t));
        if (bucket) bucket[st.mode] += next - t;
        t = next > t ? next : to;
      }
    };
    let cur = d.before ? { state: d.before.state, mode: d.before.mode } : null;
    let t0 = since;
    for (const e of d.events) {
      if (!e.state) continue;
      addSpan(t0, e.ts, cur);
      cur = { state: e.state, mode: e.mode };
      t0 = e.ts;
    }
    addSpan(t0, end, cur);
    const days = [...perDay.values()].filter((x) => x.ts <= d.now).slice(-d.days);
    const totals = { home: 0, night: 0, away: 0 };
    for (const x of days) for (const m of MODE_KEYS) totals[m] += x[m];

    const count = (k) => d.events.filter((e) => e.event === k).length;
    const incidents = new Map();
    for (const e of d.events) {
      if (!e.incident) continue;
      const inc = incidents.get(e.incident) || { id: e.incident, start: e.ts, end: e.ts, events: [] };
      inc.end = e.ts;
      inc.events.push(e);
      incidents.set(e.incident, inc);
    }
    const list = [...incidents.values()].map((inc) => {
      const first = inc.events.find((e) => e.event === "pending" || e.event === "triggered") || inc.events[0];
      const trig = inc.events.find((e) => e.event === "triggered");
      const ack = inc.events.find((e) => e.event === "acknowledged");
      const dis = inc.events.find((e) => e.event === "disarmed");
      return { ...inc, first, triggered: Boolean(trig), trig, ack, dis, shots: d.snapshots[inc.id] || 0 };
    }).sort((a, b) => b.start - a.start);

    const ackTimes = d.receipts.filter((r) => r.kind === "alarm" && r.acked_at).map((r) => r.acked_at - r.ts).sort((a, b) => a - b);
    const median = ackTimes.length ? ackTimes[Math.floor(ackTimes.length / 2)] : null;
    const outages = d.events.filter((e) => e.event === "online");
    const outageSec = outages.reduce((s, e) => s + ((e.detail && e.detail.minutes) || 0) * 60, 0);
    const triggers = new Map();
    for (const e of d.events) {
      if ((e.event === "pending" || e.event === "triggered") && e.sensor) {
        const k = e.sensor + (e.room ? ` · ${e.room}` : "");
        const cur2 = triggers.get(k) || { name: e.sensor, room: e.room, n: 0 };
        if (e.event === "pending" || !list.find((i) => i.id === e.incident && i.events.some((x) => x.event === "pending"))) cur2.n += 1;
        triggers.set(k, cur2);
      }
    }
    return {
      days, totals, incidents: list,
      kpi: {
        alarms: count("triggered"),
        pending: count("pending"),
        defused: list.filter((i) => !i.triggered && i.events.some((e) => e.event === "pending")).length,
        armedShare: (totals.home + totals.night + totals.away) / Math.max(1, end - since),
        outages: outages.length + (d.hb && d.hb.offline ? 1 : 0),
        outageSec,
        wrong: count("wrong_code"),
        ackMedian: median,
        acked: ackTimes.length,
        shots: Object.values(d.snapshots).reduce((s, n) => s + n, 0),
      },
      triggers: [...triggers.values()].sort((a, b) => b.n - a.n).slice(0, 8),
    };
  }

  // ------------------------------------------------------------- views
  const STATE_VIEW = {
    disarmed: ["Unscharf", "idle"], arming: ["Wird scharf", "maint"], pending: ["Vorwarnung", "warn"], triggered: ["Alarm", "down"],
    armed_home: ["Scharf · Zuhause", "ok"], armed_night: ["Scharf · Nacht", "ok"], armed_away: ["Scharf · Abwesend", "ok"],
  };
  const TONE_COLOR = { ok: "var(--green)", warn: "var(--orange)", down: "var(--red)", maint: "var(--violet)", idle: "var(--gray)" };

  function orb(tone, icon, large = true) {
    return `<div class="orb orb-${tone}${large ? " orb-lg" : ""}" aria-hidden="true"><div class="orb-in"><span class="orb-b b1"></span><span class="orb-b b2"></span><span class="orb-b b3"></span></div>${icon}</div>`;
  }

  function hero({ tone, icon, title, sub, stats, side }) {
    return `<section class="card hero hero-${tone}">
      <div class="hero-top">${orb(tone, icon)}<div class="hero-text"><h2>${title}</h2><p>${sub}</p></div>${side || ""}</div>
      <div class="hero-stats">${stats.map((x) => `<div class="hstat"><span class="hv ${x.cls || ""}">${esc(x.v)}</span><span class="hl">${esc(x.l)}</span></div>`).join("")}</div>
    </section>`;
  }

  function kpi(label, icon, value, sub, bad) {
    return `<div class="card kpi"><div class="label">${icon}${esc(label)}</div><div class="value ${bad ? "bad" : ""}">${esc(value)}</div>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>`;
  }

  function card(title, body, { sub = "", right = "", flush = false } = {}) {
    return `<section class="card"><div class="card-head"><div><h2>${esc(title)}</h2>${sub ? `<div class="sub">${esc(sub)}</div>` : ""}</div>${right}</div>
      <div class="card-body ${flush ? "flush" : ""}">${body}</div></section>`;
  }

  const sitTone = { critical: "down", elevated: "warn", normal: "ok" };

  function hintsCard(d) {
    const sit = situation(d);
    const color = TONE_COLOR[sitTone[sit.key]];
    const rows = sit.reasons.map((r) => `<div class="problem"><span class="dot" style="--c:${sit.key === "normal" ? "var(--green)" : color}"></span><div class="grow"><div class="pname" style="font-weight:500">${esc(r)}</div></div></div>`).join("");
    return card("Lagebild", rows, { flush: true, right: `<span class="pill ${sit.key === "normal" ? "ok" : sit.key === "critical" ? "bad" : "warn"}">${sit.label}</span>` });
  }

  function alarmHero(d) {
    const hb = d.hb;
    if (!hb) {
      return hero({ tone: "idle", icon: ICON.shieldOff, title: "Keine Daten", sub: "Home Assistant hat sich noch nicht gemeldet.", stats: [{ v: "–", l: "Lage" }, { v: "–", l: "Offen" }, { v: "–", l: "Nicht erreichbar" }, { v: "–", l: "Letztes Signal" }] });
    }
    const [label, tone0] = STATE_VIEW[hb.state] || [hb.state, "idle"];
    const tone = hb.offline ? (isArmed(hb.state) ? "down" : "warn") : tone0;
    const lastChange = [...d.events].reverse().find((e) => e.state && e.event !== "acknowledged");
    const sit = situation(d);
    const subParts = [hb.offline ? `Keine Verbindung seit ${dateTime(hb.received)}` : lastChange ? `Seit ${dateTime(lastChange.ts)}` : "", hb.instance || "", hb.version ? `Bastion ${hb.version}` : ""].filter(Boolean);
    return hero({
      tone,
      icon: tone === "down" || tone === "warn" ? ICON.alert : tone === "idle" ? ICON.shieldOff : ICON.shield,
      title: esc(hb.offline ? `${label} (letzter Stand)` : label),
      sub: esc(subParts.join(" · ")),
      side: `<span class="pill ${sit.key === "normal" ? "ok" : sit.key === "critical" ? "bad" : "warn"}">Lage: ${sit.label}</span>`,
      stats: [
        { v: hb.offline ? "Funkstille" : "Online", l: "Verbindung", cls: hb.offline ? "bad" : "ok" },
        { v: String((hb.open || []).length), l: "Offene Sensoren", cls: (hb.open || []).length ? "warn" : "" },
        { v: String((hb.unavailable || []).length), l: "Nicht erreichbar", cls: (hb.unavailable || []).length ? "warn" : "" },
        { v: rel(hb.received), l: "Letztes Signal" },
      ],
    });
  }

  // Stacked daily bars in a card (chart or table).
  function stackCard({ id, title, sub, rows, series, totals, fmt, showTable, toggle }) {
    const legend = `<div class="chart-legend">${series.map((x) => `<span><i class="sw" style="background:${x.color}"></i>${esc(x.label)}<b>${esc(fmt(totals ? totals[x.key] : rows.reduce((n, r) => n + r[x.key], 0)))}</b></span>`).join("")}</div>`;
    const table = `<div class="table-wrap" style="margin:12px -16px -16px"><table><thead><tr><th>Tag</th>${series.map((x) => `<th class="num">${esc(x.label)}</th>`).join("")}${series.length > 1 ? `<th class="num">Gesamt</th>` : ""}</tr></thead><tbody>
      ${[...rows].reverse().map((r) => `<tr><td class="t">${esc(weekday(r.ts))}</td>${series.map((x) => `<td class="num">${r[x.key] ? esc(fmt(r[x.key])) : "–"}</td>`).join("")}${series.length > 1 ? `<td class="num">${esc(fmt(series.reduce((n, x) => n + r[x.key], 0)))}</td>` : ""}</tr>`).join("")}
      </tbody></table></div>`;
    return card(title, `${legend}${showTable ? table : `<div class="chart" id="${id}"></div>`}`, {
      sub, right: `<button class="btn sm" data-toggle-table="${toggle}">${showTable ? "Diagramm" : "Tabelle"}</button>`,
    });
  }

  function barRows(items, empty) {
    if (!items.length) return `<div class="empty">${esc(empty)}</div>`;
    const max = Math.max(1, ...items.map((x) => x.total));
    return `<div class="bars">${items.map((x) => `<div class="bar-row" title="${esc(x.title || x.label)}">
      <span class="label">${x.labelHtml || esc(x.label)}</span>
      <span class="bar-track">${x.parts.filter((p) => p.n).map((p) => `<span class="bar-fill" style="width:${(p.n / max) * 100}%;--c:${p.color}"></span>`).join("")}</span>
      <span class="val">${x.total}</span></div>`).join("")}</div>`;
  }

  function triggersCard(a) {
    return card("Häufigste Auslöser", barRows(a.triggers.map((x) => ({
      label: x.name, labelHtml: `${esc(x.name)}${x.room ? ` <span class="faint">· ${esc(x.room)}</span>` : ""}`, total: x.n, parts: [{ n: x.n, color: "var(--s3)" }],
    })), "Keine Auslösungen im Zeitraum."), { sub: "Vorwarnungen und Alarme pro Sensor", flush: true });
  }

  function incidentsCard(list) {
    if (!list.length) return card("Vorfälle", `<div class="empty">Keine Vorfälle im Zeitraum.</div>`, { flush: true });
    const rows = list.slice(0, 30).map((inc) => {
      const tag = inc.triggered ? `<span class="tag dotted" style="--c:var(--red)">Alarm</span>` : `<span class="tag dotted" style="--c:var(--orange)">Vorwarnung entschärft</span>`;
      return `<tr class="link" data-href="/i/${esc(inc.id)}"><td class="t mono">#${esc(inc.id.slice(0, 8).toUpperCase())}</td>
        <td><span class="name">${esc(where(inc.first) || LABELS[inc.first.event] || "Vorfall")}</span></td><td>${tag}</td>
        <td class="t">${esc(dateTime(inc.start))}</td>
        <td class="hide-sm">${inc.ack ? esc(inc.ack.user || "Pushover") : `<span class="faint">–</span>`}</td>
        <td class="hide-sm">${inc.dis ? `${esc(inc.dis.user || "–")} <span class="faint">nach ${esc(duration(inc.dis.ts - inc.start))}</span>` : `<span class="faint">–</span>`}</td>
        <td class="num hide-sm">${inc.shots || "–"}</td></tr>`;
    }).join("");
    return card("Vorfälle", `<div class="table-wrap"><table><thead><tr><th>Fall</th><th>Auslöser</th><th>Ergebnis</th><th>Beginn</th><th class="hide-sm">Quittiert</th><th class="hide-sm">Unscharf</th><th class="num hide-sm">Bilder</th></tr></thead><tbody>${rows}</tbody></table></div>`, { flush: true });
  }

  function seg(items, current, attr) {
    return `<div class="seg">${items.map(([k, l]) => `<button class="${current === k ? "active" : ""}" ${attr}="${k}">${l}</button>`).join("")}</div>`;
  }

  function logCard(d, filter) {
    const all = [...d.events].reverse().filter((e) => filter === "all" || (GROUPS[filter] || []).includes(e.event));
    const evs = all.slice(0, view.logLimit);
    const rows = evs.length ? evs.map((e) => {
      const det = [e.mode && MODES[e.mode] && !["acknowledged", "online", "offline", "restart", "attack", "exposure"].includes(e.event) ? MODES[e.mode] : "", where(e), e.user,
        e.detail && e.detail.minutes ? `${e.detail.minutes} Min.` : "", (e.detail && (e.detail.cause || e.detail.verdict)) || "",
        e.detail && e.detail.sensors ? `offen: ${e.detail.sensors.join(", ")}` : "",
        e.event === "attack" && e.detail ? `${e.detail.total} abgewiesen` : ""].filter(Boolean).join(" · ");
      return `<tr><td class="t">${esc(dateTime(e.ts))}</td><td><span class="tag dotted" style="--c:${EV_COLOR[e.event] || "var(--gray)"}">${esc(LABELS[e.event] || e.event)}</span></td>
        <td class="msg">${esc(det)}${e.incident ? ` <a href="/i/${esc(e.incident)}">Fall #${esc(e.incident.slice(0, 8).toUpperCase())}</a>` : ""}</td></tr>`;
    }).join("") : `<tr><td colspan="3" class="empty">Keine Ereignisse.</td></tr>`;
    return `<section class="card"><div class="card-head"><h2>Protokoll</h2><span class="faint small">${all.length} Einträge</span></div>
      <div class="toolbar">${seg([["all", "Alle"], ["alarm", "Alarm"], ["ops", "Bedienung"], ["system", "System"]], filter, "data-log")}</div>
      <div class="table-wrap"><table><thead><tr><th>Zeit</th><th>Ereignis</th><th>Details</th></tr></thead><tbody>${rows}</tbody></table></div>
      ${all.length > evs.length ? `<div class="more"><button class="btn sm" data-more>Weitere ${Math.min(50, all.length - evs.length)} anzeigen</button></div>` : ""}</section>`;
  }

  function rangeRow(title) {
    return `<div class="row spread mt"><div class="section-title" style="margin:0">${esc(title)}</div>${seg([[7, "7 Tage"], [30, "30 Tage"], [90, "90 Tage"], [365, "1 Jahr"]].map(([k, l]) => [String(k), l]), String(view.days), "data-days")}</div>`;
  }

  // ------------------------------------------------------ remote control
  const ACTIONS = {
    arm_away: { action: "arm", mode: "away", label: "Abwesend", icon: "shield" },
    arm_home: { action: "arm", mode: "home", label: "Zuhause", icon: "home" },
    arm_night: { action: "arm", mode: "night", label: "Nacht", icon: "moon" },
    disarm: { action: "disarm", label: "Unscharf", icon: "power" },
  };
  const CMD_STATUS = { pending: ["Wartet", "warn"], delivered: ["Läuft", "warn"], done: ["Ausgeführt", "ok"], failed: ["Fehlgeschlagen", "bad"], expired: ["Nicht abgeholt", "bad"] };
  const CMD_ERRORS = {
    open_sensors: (x) => `Nicht scharf geschaltet, offen: ${[].concat(x || []).join(", ")}.`,
    not_allowed: () => "In Home Assistant nicht erlaubt.",
    disabled: () => "Die Fernsteuerung ist in Home Assistant ausgeschaltet.",
    signature: () => "Home Assistant hat die Signatur abgelehnt (ALARM_SECRET prüfen).",
    stale: () => "Der Befehl war zu alt (Uhrzeit von Home Assistant prüfen).",
  };
  const remoteUi = { busy: false, msg: "", tone: "", force: null, code: "", pairOpen: false, intent: new URLSearchParams(location.search).get("do") };
  const hasWebAuthn = () => Boolean(window.PublicKeyCredential && navigator.credentials && navigator.credentials.create);
  const cmdLabel = (c) => (c.action === "disarm" ? "Unscharf" : `Scharf · ${MODES[c.mode] || c.mode}${c.force ? " (trotz offener Sensoren)" : ""}`);

  const b64u = {
    enc: (buf) => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, "-").replace(/\//g, "_").replace(/=+$/, ""),
    dec: (s) => Uint8Array.from(atob(s.replace(/-/g, "+").replace(/_/g, "/") + "===".slice((s.length + 3) % 4)), (c) => c.charCodeAt(0)),
  };

  async function post(path, body) {
    let r;
    try {
      r = await fetch(path, { method: "POST", credentials: "same-origin", headers: { "content-type": "application/json", accept: "application/json" }, body: JSON.stringify(body) });
    } catch {
      throw new Error("Keine Verbindung.");
    }
    const data = await r.json().catch(() => ({}));
    if (!r.ok) throw new Error(data.error || `Fehler ${r.status}`);
    return data;
  }

  function passkeyError(err) {
    if (err && err.name === "NotAllowedError") return "Abgebrochen oder abgelaufen.";
    if (err && err.name === "InvalidStateError") return "Dieser Passkey ist schon gekoppelt.";
    return (err && err.message) || "Fehler";
  }

  function setRemote(msg, tone, extra = {}) {
    Object.assign(remoteUi, { msg, tone, force: null, ...extra });
    if (view.data) renderDashboard();
  }

  async function pairPasskey() {
    remoteUi.busy = true;
    setRemote("Passkey wird angelegt …", "");
    try {
      const opt = await post("/api/passkey/begin", { code: remoteUi.code });
      const pk = opt.publicKey;
      const cred = await navigator.credentials.create({ publicKey: {
        ...pk, challenge: b64u.dec(pk.challenge), user: { ...pk.user, id: b64u.dec(pk.user.id) },
        excludeCredentials: pk.excludeCredentials.map((c) => ({ ...c, id: b64u.dec(c.id) })),
      } });
      const res = await post("/api/passkey/finish", { challengeId: opt.challengeId, credential: {
        id: cred.id, type: cred.type,
        response: { clientDataJSON: b64u.enc(cred.response.clientDataJSON), attestationObject: b64u.enc(cred.response.attestationObject) },
      } });
      remoteUi.busy = false;
      remoteUi.code = "";
      remoteUi.pairOpen = false;
      setRemote(`Passkey „${res.name}“ gekoppelt. Du kannst die Alarmanlage jetzt schalten.`, "ok");
      loadDashboard();
    } catch (err) {
      remoteUi.busy = false;
      setRemote(passkeyError(err), "bad");
    }
  }

  async function sendCommand(key, force) {
    const a = ACTIONS[key];
    remoteUi.busy = true;
    remoteUi.intent = null;
    if (location.search) history.replaceState(null, "", location.pathname + location.hash);
    setRemote(`${a.label}: Passkey bestätigen …`, "");
    try {
      const opt = await post("/api/command/begin", { action: a.action, mode: a.mode, force: Boolean(force) });
      const pk = opt.publicKey;
      const cred = await navigator.credentials.get({ publicKey: { ...pk, challenge: b64u.dec(pk.challenge), allowCredentials: pk.allowCredentials.map((c) => ({ ...c, id: b64u.dec(c.id) })) } });
      const r = cred.response;
      const res = await post("/api/command/finish", { challengeId: opt.challengeId, credential: {
        id: cred.id, type: cred.type,
        response: { clientDataJSON: b64u.enc(r.clientDataJSON), authenticatorData: b64u.enc(r.authenticatorData), signature: b64u.enc(r.signature), userHandle: r.userHandle ? b64u.enc(r.userHandle) : null },
      } });
      setRemote(`${res.label}: gesendet, Home Assistant übernimmt …`, "warn");
      const started = Date.now();
      while (Date.now() - started < 100000) {
        await new Promise((ok) => setTimeout(ok, 1500));
        let st;
        try { st = await api(`/api/command/${res.id}`); } catch { continue; }
        if (st.status === "done") { remoteUi.busy = false; setRemote(`${st.label}: ausgeführt.`, "ok"); loadDashboard(); return; }
        if (st.status === "failed") {
          remoteUi.busy = false;
          const err = st.result && st.result.error;
          const text = (CMD_ERRORS[err] || ((x) => `Fehlgeschlagen: ${err || "unbekannt"}${x ? ` (${x})` : ""}.`))(st.result && st.result.detail);
          setRemote(text, "bad", { force: err === "open_sensors" && a.action === "arm" ? key : null });
          loadDashboard();
          return;
        }
        if (st.status === "expired") break;
      }
      remoteUi.busy = false;
      setRemote("Home Assistant hat den Befehl nicht abgeholt. Ist Home Assistant online?", "bad");
    } catch (err) {
      remoteUi.busy = false;
      setRemote(passkeyError(err), "bad");
    }
  }

  function pairForm(r) {
    return `<div class="stack">
      <div class="muted small">In Home Assistant unter <b>Bastion → Alarmanlage → Einstellungen → Cloud-Worker → Fernsteuerung</b> „Passkey koppeln“ wählen und den 8-stelligen Code hier eingeben. Der Passkey bleibt auf diesem Gerät bzw. in deinem Passwortmanager.</div>
      <div class="row"><input class="input" id="pair-code" inputmode="numeric" autocomplete="one-time-code" maxlength="9" placeholder="1234-5678" value="${esc(remoteUi.code)}" style="width:150px">
        <button class="btn primary" data-pair ${remoteUi.busy ? "disabled" : ""}>${ICON.key}Passkey anlegen</button></div>
      ${r.pairing ? `<div class="faint small">Ein Kopplungscode ist aktiv.</div>` : `<div class="faint small">Gerade ist kein Kopplungscode aktiv.</div>`}
    </div>`;
  }

  function commandsTable(list) {
    if (!list || !list.length) return "";
    return `<div class="table-wrap" style="margin:16px -16px -16px;border-top:1px solid var(--border)"><table><thead><tr><th>Zeit</th><th>Befehl</th><th class="hide-sm">Von</th><th>Ergebnis</th></tr></thead><tbody>
      ${list.map((c) => {
        const [l, tone] = CMD_STATUS[c.status] || [c.status, ""];
        return `<tr><td class="t">${esc(dateTime(c.ts))}</td><td>${esc(cmdLabel(c))}</td><td class="hide-sm">${esc(c.passkey || c.by || "")}</td><td><span class="pill ${tone}">${esc(l)}</span></td></tr>`;
      }).join("")}</tbody></table></div>`;
  }

  function remoteCards(d) {
    const r = d.remote;
    if (!r || !r.enabled) return "";
    const hb = d.hb || {};
    const keys = r.passkeys || [];
    const msg = remoteUi.msg ? `<div class="notice ${remoteUi.tone}">${esc(remoteUi.msg)}${remoteUi.force ? `<br><button class="btn sm" data-remote-force="${remoteUi.force}">Trotzdem scharf schalten</button>` : ""}</div>` : "";
    if (!hasWebAuthn()) return `<div class="mt">${card("Fernsteuerung", `<div class="muted">Dieser Browser unterstützt keine Passkeys.</div>`)}</div>`;
    if (!keys.length) {
      return `<div class="mt">${card("Fernsteuerung", `${pairForm(r)}${msg}`, { sub: "Scharf und unscharf schalten mit Passkey", right: `<span class="pill">Kein Passkey</span>` })}</div>`;
    }
    const current = !hb.state || hb.state === "disarmed" ? "disarm" : hb.mode ? `arm_${hb.mode}` : "";
    const intent = remoteUi.intent && ACTIONS[remoteUi.intent] && (remoteUi.intent !== "disarm" || r.disarm) ? remoteUi.intent : null;
    const buttons = Object.entries(ACTIONS).filter(([k]) => k !== "disarm" || r.disarm).map(([k, a]) => `<button class="btn ctl ${k === current ? "current" : ""}" data-remote="${k}" ${remoteUi.busy || hb.offline ? "disabled" : ""}>
      ${ICON[a.icon]}<span>${esc(a.label)}</span><small>${k === current ? "Aktuell" : k === "disarm" ? "Ausschalten" : "Scharf schalten"}</small></button>`).join("");
    const controls = card("Fernsteuerung", `${intent ? `<div class="notice warn" style="margin:0 0 12px">Aus der Erinnerung: <b>${esc(ACTIONS[intent].label)}</b> scharf schalten?<br>
        <button class="btn sm primary" data-remote="${intent}" ${remoteUi.busy ? "disabled" : ""}>Mit Passkey bestätigen</button><button class="btn sm" data-remote-dismiss>Nein</button></div>` : ""}
      <div class="ctl-grid">${buttons}</div>${msg}
      <div class="faint small" style="margin-top:12px">Jeder Befehl verlangt deinen Passkey (Face ID, Fingerabdruck oder PIN).${r.disarm ? "" : " Unscharf schalten aus der Ferne ist in Home Assistant nicht freigegeben."}${hb.offline ? " Home Assistant ist gerade nicht erreichbar." : ""}</div>
      ${commandsTable(r.commands)}`, { sub: "Befehle holt Home Assistant beim Worker ab" });
    const list = `<div class="table-wrap"><table><thead><tr><th>Gerät</th><th class="hide-sm">Gekoppelt</th><th>Zuletzt</th></tr></thead><tbody>
      ${keys.map((k) => `<tr><td><span class="name">${esc(k.name || "Passkey")}</span></td><td class="t hide-sm">${esc(dateTime(k.created))}</td><td class="t">${k.last_used ? esc(rel(k.last_used)) : "–"}</td></tr>`).join("")}
      </tbody></table></div>`;
    const more = remoteUi.pairOpen ? `<div class="card-body" style="border-top:1px solid var(--border)">${pairForm(r)}</div>`
      : `<div class="more"><button class="btn sm" data-pair-open>${ICON.key}Weiteren Passkey koppeln</button></div>`;
    const keysCard = `<section class="card"><div class="card-head"><div><h2>Passkeys</h2><div class="sub">Entfernen in Home Assistant</div></div><span class="faint small">${keys.length}</span></div>${list}${more}</section>`;
    return `<div class="grid two mt">${controls}${keysCard}</div>`;
  }

  function renderAlarm(d) {
    const a = analyse(d);
    const k = a.kpi;
    return {
      html: `${alarmHero(d)}
        ${remoteCards(d)}
        <div class="grid two mt">${hintsCard(d)}${triggersCard(a)}</div>
        ${rangeRow("Zeitraum")}
        <div class="grid kpis mt">
          ${kpi("Alarme", ICON.bell, String(k.alarms), k.acked ? `${k.acked} quittiert` : "keine quittiert", k.alarms > 0)}
          ${kpi("Vorwarnungen", ICON.alert, String(k.pending), `${k.defused} rechtzeitig entschärft`)}
          ${kpi("Scharf", ICON.shield, `${Math.round(k.armedShare * 100)} %`, "der Zeit im Zeitraum")}
          ${kpi("Quittierzeit", ICON.clock, k.ackMedian == null ? "–" : duration(k.ackMedian), "Median bis zur Bestätigung")}
          ${kpi("Funkstille", ICON.wifiOff, String(k.outages), k.outageSec ? `insgesamt ${duration(k.outageSec)}` : "keine Ausfälle", k.outages > 0)}
          ${kpi("Falsche Codes", ICON.key, String(k.wrong), k.shots ? `${k.shots} Kamerabilder gespeichert` : "")}
        </div>
        <div class="mt">${stackCard({ id: "armed-chart", title: "Scharf-Zeit pro Tag", sub: "Stunden pro Modus", rows: a.days, series: MODE_SERIES, totals: a.totals, fmt: hours, showTable: view.table, toggle: "armed" })}</div>
        <div class="mt">${incidentsCard(a.incidents)}</div>
        <div class="mt">${logCard(d, view.log)}</div>`,
      bind: () => bindStack("armed-chart", a.days, MODE_SERIES, ARMED_OPTS, hours),
    };
  }

  function situation(d) {
    const crit = [];
    const warn = [];
    const hb = d.hb;
    const sec = d.security;
    if (hb) {
      if (hb.state === "triggered") crit.push("Alarm ausgelöst");
      if (hb.state === "pending") warn.push("Vorwarnung läuft");
      if (hb.offline) (isArmed(hb.state) ? crit : warn).push("Keine Verbindung zu Home Assistant");
      if ((hb.unavailable || []).length) warn.push(`${hb.unavailable.length} Sensor${hb.unavailable.length === 1 ? "" : "en"} nicht erreichbar`);
    } else warn.push("Home Assistant hat sich noch nicht gemeldet");
    if (sec) {
      if (sec.counts.critical) crit.push(`${sec.counts.critical} kritische${sec.counts.critical === 1 ? "r" : ""} Befund${sec.counts.critical === 1 ? "" : "e"}`);
      if (sec.score < 70) warn.push(`Sicherheitswert ${Math.round(sec.score)}`);
      if (sec.failed_24h >= 5) warn.push(`${sec.failed_24h} Fehlversuche in 24 h`);
    }
    const dayAgo = d.now - 86400;
    const attempts = (d.attempts || []).filter((a) => a.ts >= dayAgo).reduce((n, a) => n + a.n, 0);
    if (attempts) warn.push(`${attempts} abgewiesene Zugriffe am Worker (24 h)`);
    const decoys = (d.canary || []).filter((c) => c.ts >= dayAgo).length;
    if (decoys) crit.push(`Köder ${decoys}× benutzt (24 h) – Zugangsdaten in fremden Händen`);
    for (const r of (d.exposure && d.exposure.results) || []) {
      for (const c of r.checks) {
        if (c.level === "critical") crit.push(`Außenprüfung: ${c.text}`);
        else if (c.level === "warning") warn.push(`Außenprüfung: ${c.text}`);
      }
    }
    if (crit.length) return { key: "critical", label: "Kritisch", color: "var(--critical)", reasons: [...crit, ...warn] };
    if (warn.length) return { key: "elevated", label: "Erhöht", color: "var(--warning)", reasons: warn };
    return { key: "normal", label: "Normal", color: "var(--good)", reasons: ["Keine Auffälligkeiten"] };
  }

  function scoreSvg(points, width) {
    const W = Math.max(280, Math.round(width)), H = 170, L = 34, B = 24, T = 10, R = 8;
    const t0 = points[0].t, t1 = Math.max(points[points.length - 1].t, t0 + 86400);
    const x = (t) => L + ((W - L - R) * (t - t0)) / (t1 - t0);
    const y = (v) => T + (H - T - B) * (1 - v / 100);
    const path = points.map((p, i) => `${i ? "L" : "M"}${x(p.t).toFixed(1)},${y(p.v).toFixed(1)}`).join(" ");
    let svg = `<g class="grid">${[0, 50, 100].map((v) => `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}"/>`).join("")}</g>`;
    svg += `<g class="axis">${[0, 50, 100].map((v) => `<text x="${L - 8}" y="${y(v) + 4}" text-anchor="end">${v}</text>`).join("")}`;
    svg += `<text x="${L}" y="${H - 6}">${esc(dayShort(t0))}</text><text x="${W - R}" y="${H - 6}" text-anchor="end">${esc(dayShort(points[points.length - 1].t))}</text></g>`;
    svg += `<path d="${path}" fill="none" stroke="var(--s1)" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>`;
    const last = points[points.length - 1];
    svg += `<circle cx="${x(last.t)}" cy="${y(last.v)}" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2"/>`;
    svg += `<line class="cross" x1="0" x2="0" y1="${T}" y2="${H - B}" stroke="var(--line-strong)" stroke-width="1" visibility="hidden"/>`;
    svg += `<circle class="cross-dot" r="4" fill="var(--s1)" stroke="var(--surface)" stroke-width="2" visibility="hidden"/>`;
    svg += `<rect class="hit-all" x="${L}" y="${T}" width="${W - L - R}" height="${H - T - B}" fill="transparent"/>`;
    return { svg: `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="Verlauf des Sicherheitswerts">${svg}</svg>`, x, y };
  }

  function bindScore(points) {
    const box = document.getElementById("score-chart");
    if (!box || points.length < 2) return;
    const { svg, x, y } = scoreSvg(points, box.clientWidth);
    box.innerHTML = svg;
    const el = box.querySelector("svg");
    const cross = el.querySelector(".cross");
    const dot = el.querySelector(".cross-dot");
    let tip = null;
    el.addEventListener("mousemove", (ev) => {
      const rb = el.getBoundingClientRect();
      const mx = ((ev.clientX - rb.left) / rb.width) * el.viewBox.baseVal.width;
      const p = points.reduce((best, q) => (Math.abs(x(q.t) - mx) < Math.abs(x(best.t) - mx) ? q : best), points[0]);
      cross.setAttribute("x1", x(p.t)); cross.setAttribute("x2", x(p.t)); cross.setAttribute("visibility", "visible");
      dot.setAttribute("cx", x(p.t)); dot.setAttribute("cy", y(p.v)); dot.setAttribute("visibility", "visible");
      if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
      tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(weekday(p.t))}</div><div class="tip-row"><i style="background:var(--s1)"></i>Sicherheitswert<b>${Math.round(p.v)}</b></div>`;
      tip.style.left = `${Math.min(rb.width - 80, Math.max(80, (x(p.t) / el.viewBox.baseVal.width) * rb.width))}px`;
      tip.style.top = `${(y(p.v) / el.viewBox.baseVal.height) * rb.height}px`;
    });
    el.addEventListener("mouseleave", () => {
      cross.setAttribute("visibility", "hidden"); dot.setAttribute("visibility", "hidden");
      if (tip) { tip.remove(); tip = null; }
    });
  }

  async function loadShots(d, token) {
    for (const s of d.snapshots) {
      const fig = app.querySelector(`[data-shot="${s.id}"]`);
      if (!fig) continue;
      try {
        const q = new URLSearchParams({ i: d.incident });
        if (token) q.set("t", token);
        const img = await api(`/api/img/${s.id}?${q}`);
        const el = document.createElement("img");
        el.alt = `${img.camera || "Kamera"} ${timeOnly(img.ts)}`;
        el.src = `data:${img.type};base64,${img.data}`;
        fig.querySelector(".ph").replaceWith(el);
        fig.addEventListener("click", () => {
          const box = document.createElement("div");
          box.className = "lightbox";
          box.innerHTML = `<img alt="" src="${el.src}">`;
          box.addEventListener("click", () => box.remove());
          document.body.appendChild(box);
        });
      } catch {
        fig.querySelector(".ph").textContent = "nicht verfügbar";
      }
    }
  }

  function stackSvg(rows, series, width, opts) {
    const W = Math.max(280, Math.round(width)), H = W < 500 ? 190 : 230, L = 34, B = 24, T = 8, R = 4;
    const max = opts.max;
    const cw = (W - L - R) / rows.length;
    const bw = Math.max(3, Math.min(26, cw - Math.max(2, cw * 0.28)));
    const y = (v) => T + (H - T - B) * (1 - v / max);
    let svg = `<g class="grid">${opts.ticks.map((t) => `<line x1="${L}" x2="${W - R}" y1="${y(t)}" y2="${y(t)}"/>`).join("")}</g>`;
    svg += `<g class="axis">${opts.ticks.map((t) => `<text x="${L - 8}" y="${y(t) + 4}" text-anchor="end">${esc(opts.tick(t))}</text>`).join("")}`;
    const every = Math.ceil(rows.length / Math.max(3, Math.floor(W / 90)));
    rows.forEach((row, i) => {
      if ((rows.length - 1 - i) % every === 0) svg += `<text x="${L + cw * i + cw / 2}" y="${H - 6}" text-anchor="middle">${esc(dayShort(row.ts))}</text>`;
    });
    svg += "</g><g>";
    rows.forEach((row, i) => {
      const x = L + cw * i + (cw - bw) / 2;
      let acc = 0;
      const segs = series.filter((s) => row[s.key] > 0);
      segs.forEach((s, j) => {
        const y0 = y(acc), y1 = y(acc + row[s.key]);
        acc += row[s.key];
        const gap = j > 0 ? 2 : 0;
        const h = Math.max(0, y0 - y1 - gap);
        if (h <= 0) return;
        const r = j === segs.length - 1 ? Math.min(4, h, bw / 2) : 0;
        const yt = y0 - gap - h;
        svg += r
          ? `<path fill="${s.color}" d="M${x},${y0 - gap} V${yt + r} Q${x},${yt} ${x + r},${yt} H${x + bw - r} Q${x + bw},${yt} ${x + bw},${yt + r} V${y0 - gap} Z"/>`
          : `<rect fill="${s.color}" x="${x}" y="${yt}" width="${bw}" height="${h}"/>`;
      });
      svg += `<rect class="hit" data-i="${i}" x="${L + cw * i}" y="${T}" width="${cw}" height="${H - T - B}"/>`;
    });
    svg += "</g>";
    return `<svg width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(opts.label)}">${svg}</svg>`;
  }

  function niceMax(v) {
    if (v <= 4) return 4;
    const step = Math.pow(10, Math.floor(Math.log10(v)));
    for (const m of [1, 2, 2.5, 5, 10]) if (v <= m * step) return m * step;
    return 10 * step;
  }

  function bindStack(id, rows, series, opts, fmt) {
    const box = document.getElementById(id);
    if (!box) return;
    box.innerHTML = stackSvg(rows, series, box.clientWidth, opts);
    let tip = null;
    box.addEventListener("mousemove", (ev) => {
      const hit = ev.target.closest(".hit");
      if (!hit) { if (tip) { tip.remove(); tip = null; } return; }
      const row = rows[Number(hit.dataset.i)];
      if (!tip) { tip = document.createElement("div"); tip.className = "tip"; box.appendChild(tip); }
      const total = series.reduce((n, s) => n + row[s.key], 0);
      tip.innerHTML = `<div style="font-weight:600;margin-bottom:4px">${esc(weekday(row.ts))}</div>` +
        series.map((s) => `<div class="tip-row"><i style="background:${s.color}"></i>${esc(s.label)}<b>${row[s.key] ? esc(fmt(row[s.key])) : "–"}</b></div>`).join("") +
        (series.length > 1 ? `<div class="tip-row muted" style="margin-top:4px">Gesamt<b>${esc(fmt(total))}</b></div>` : "");
      const rb = box.getBoundingClientRect();
      const hb = hit.getBoundingClientRect();
      tip.style.left = `${Math.min(rb.width - 80, Math.max(80, hb.left - rb.left + hb.width / 2))}px`;
      tip.style.top = `${ev.clientY - rb.top}px`;
    });
    box.addEventListener("mouseleave", () => { if (tip) { tip.remove(); tip = null; } });
  }

  const MODE_SERIES = MODE_KEYS.map((m) => ({ key: m, label: MODES[m], color: MODE_VAR[m] }));
  const ARMED_OPTS = { max: 86400, ticks: [0, 6, 12, 18, 24].map((h) => h * 3600), tick: (t) => `${t / 3600}h`, label: "Scharf-Zeit pro Tag nach Modus" };

  // ----------------------------------------------------------- security
  const SEV_VIEW = {
    critical: ["Kritisch", "var(--critical)"], high: ["Hoch", "var(--serious)"], medium: ["Mittel", "var(--warning)"],
    low: ["Niedrig", "var(--s1)"], info: ["Info", "var(--idle)"],
  };
  const CATEGORY = { access: "Zugang", exposure: "Erreichbarkeit", updates: "Updates", supply_chain: "Integrationen", config: "Konfiguration", git: "Git", anomaly: "Anomalie" };
  const SEC_LABELS = {
    login: "Anmeldung", new_ip: "Neue IP", token_new_ip: "Token von neuer IP", failed_login: "Fehlversuch", brute_force: "Brute-Force-Verdacht",
    ip_banned: "IP gesperrt (HA)", token_created: "Token erstellt", token_removed: "Token entfernt", user_added: "Benutzer angelegt",
    user_removed: "Benutzer gelöscht", admin_granted: "Admin-Rechte vergeben", user_activated: "Benutzer aktiviert", canary: "Köder ausgelöst",
    blocked: "Gesperrt (Bastion)", confirmed: "Bestätigt", unusual_login_time: "Ungewöhnliche Anmeldezeit", unusual_action: "Ungewöhnliche Aktion",
    sabotage: "Sabotageverdacht", tamper: "Manipulation", new_destination: "Neues Verbindungsziel", external_config_change: "Konfiguration extern geändert",
  };
  const SEC_COLOR = {
    login: "var(--good)", confirmed: "var(--good)", failed_login: "var(--serious)", brute_force: "var(--critical)", ip_banned: "var(--critical)",
    canary: "var(--critical)", blocked: "var(--critical)", sabotage: "var(--critical)", tamper: "var(--critical)", admin_granted: "var(--serious)",
    new_ip: "var(--warning)", token_new_ip: "var(--warning)", token_created: "var(--warning)", user_added: "var(--warning)",
  };
  const SEC_GROUPS = {
    failed: ["failed_login", "brute_force", "ip_banned", "blocked"],
    logins: ["login", "new_ip", "token_new_ip", "confirmed"],
    accounts: ["token_created", "token_removed", "user_added", "user_removed", "admin_granted", "user_activated"],
  };
  const ATTACK_KIND = { signature: "Signatur", probe_token: "Probe-Token", callback: "Pushover-Rückruf", link_token: "Vorfall-Link", access: "Access" };
  const SEC_SERIES = [{ key: "ha", label: "Home Assistant", color: "var(--s1)" }, { key: "worker", label: "Worker", color: "var(--s2)" }];
  const level = (score) => (score >= 90 ? ["Gut", "var(--good)"] : score >= 70 ? ["Ausbaufähig", "var(--warning)"] : score >= 50 ? ["Riskant", "var(--serious)"] : ["Kritisch", "var(--critical)"]);

  function dayRows(d, init) {
    const since = d.now - d.days * 86400;
    const map = new Map();
    for (let t = since; t <= d.now; t += 86400) map.set(dayKey(t), { ts: t, ...init() });
    if (!map.has(dayKey(d.now))) map.set(dayKey(d.now), { ts: d.now, ...init() });
    return map;
  }

  function analyseSecurity(d) {
    const ev = d.secevents || [];
    const attempts = d.attempts || [];
    const days = dayRows(d, () => ({ ha: 0, worker: 0 }));
    const sources = new Map();
    const src = (ip, geo) => {
      const cur = sources.get(ip) || { ip, geo: geo || "", ha: 0, worker: 0, blocked: false };
      if (geo && !cur.geo) cur.geo = geo;
      sources.set(ip, cur);
      return cur;
    };
    for (const e of ev) {
      if (e.type !== "failed_login") continue;
      const row = days.get(dayKey(e.ts));
      if (row) row.ha += 1;
      if (e.ip) src(e.ip, e.geo).ha += 1;
    }
    for (const a of attempts) {
      const row = days.get(dayKey(a.ts));
      if (row) row.worker += a.n;
      src(a.ip, a.country).worker += a.n;
    }
    const active = (d.blocked || []).filter((b) => b.until > d.now);
    for (const b of active) if (sources.has(b.ip)) sources.get(b.ip).blocked = true;
    const count = (types) => ev.filter((e) => types.includes(e.type)).length;
    return {
      days: [...days.values()].slice(-d.days),
      failed: count(["failed_login"]),
      logins: count(["login"]),
      newIps: count(["new_ip", "token_new_ip"]),
      banned: count(["ip_banned", "blocked"]),
      brute: count(["brute_force"]),
      accounts: count(SEC_GROUPS.accounts),
      workerAttempts: attempts.reduce((n, a) => n + a.n, 0),
      blockedActive: active,
      sources: [...sources.values()].map((x) => ({ ...x, n: x.ha + x.worker })).sort((a, b) => b.n - a.n).slice(0, 8),
    };
  }

  // ------------------------------------------------------- security views
  const SEV_TONE = { critical: "var(--red)", high: "#f97316", medium: "var(--orange)", low: "var(--primary)", info: "var(--gray)" };
  const levelTone = (score) => (score >= 90 ? "ok" : score >= 70 ? "warn" : "down");

  function securityHero(d) {
    const sec = d.security;
    if (!sec) return hero({ tone: "idle", icon: ICON.lock, title: "Kein Sicherheitsüberblick", sub: "Bastion schickt ihn mit dem nächsten Lebenszeichen.", stats: ["Kritisch", "Hoch", "Mittel", "Niedrig"].map((l) => ({ v: "–", l })) });
    const [label] = level(sec.score);
    const audit = sec.last_audit ? Date.parse(sec.last_audit) / 1000 : null;
    const sub = [`${sec.open} offene Befunde`, audit ? `Audit ${rel(audit)}` : "", sec.git && sec.git.status && sec.git.status !== "disabled" ? `Git: ${sec.git.status}` : ""].filter(Boolean).join(" · ");
    return hero({
      tone: levelTone(sec.score), icon: ICON.lock,
      title: `Sicherheitswert ${Math.round(sec.score)} · ${esc(label)}`, sub: esc(sub),
      stats: [
        { v: String(sec.counts.critical || 0), l: "Kritisch", cls: sec.counts.critical ? "bad" : "" },
        { v: String(sec.counts.high || 0), l: "Hoch", cls: sec.counts.high ? "warn" : "" },
        { v: String(sec.counts.medium || 0), l: "Mittel" },
        { v: String(sec.counts.low || 0), l: "Niedrig" },
      ],
    });
  }

    }).join("") + (list.length > 15 ? `<div class="more faint small">und ${list.length - 15} weitere</div>` : "") : `<div class="empty">Keine offenen Befunde.</div>`;
