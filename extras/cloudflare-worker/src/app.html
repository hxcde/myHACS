  function scoreCard(sec, d) {
    const since = d.now - d.days * 86400;
    const points = ((sec && sec.history) || []).map((h) => ({ t: Date.parse(`${h.date}T12:00:00Z`) / 1000, v: h.score })).filter((p) => p.t >= since - 86400);
    if (sec) points.push({ t: d.now, v: sec.score });
    const body = points.length >= 2 ? `<div class="chart" id="score-chart" style="margin-top:0"></div>` : `<div class="empty">Der Verlauf erscheint nach einigen Audits.</div>`;
    return { html: card("Verlauf des Sicherheitswerts", body, { sub: "Ein Wert pro Tag (letztes Audit des Tages)" }), points };
  }

  function renderSecurity(d) {
    const s = analyseSecurity(d);
    const sec = d.security;
    const score = scoreCard(sec, d);
    const maxDay = niceMax(Math.max(1, ...s.days.map((r) => r.ha + r.worker)));
    const opts = { max: maxDay, ticks: [0, maxDay / 4, maxDay / 2, (3 * maxDay) / 4, maxDay].map((v) => Math.round(v * 100) / 100), tick: (t) => String(t), label: "Fehlversuche pro Tag" };
    return {
      html: `${securityHero(d)}
        <div class="grid two mt">${findingsCard(sec)}${exposureCard(d.exposure)}</div>
        ${rangeRow("Zeitraum")}
        <div class="grid kpis mt">
          ${kpi("Fehlversuche", ICON.ban, String(s.failed), sec ? `${sec.failed_24h} in den letzten 24 h` : "", s.failed > 0)}
          ${kpi("Anmeldungen", ICON.user, String(s.logins), s.newIps ? `${s.newIps} von neuen IPs` : "keine neuen IPs")}
          ${kpi("Gesperrt", ICON.lock, String(s.banned), s.brute ? `${s.brute}× Brute-Force-Verdacht` : "von HA und Bastion", s.brute > 0)}
          ${kpi("Konten & Tokens", ICON.key, String(s.accounts), "Änderungen im Zeitraum")}
          ${kpi("Worker", ICON.globe, String(s.workerAttempts), s.blockedActive.length ? `${s.blockedActive.length} IP gesperrt` : "abgewiesene Zugriffe", s.workerAttempts > 0)}
          ${kpi("Köder", ICON.bird, String((d.canary || []).length), (d.canary || []).length ? "Köderdatei kompromittiert" : "nicht ausgelöst", (d.canary || []).length > 0)}
        </div>
        <div class="grid two mt">${stackCard({ id: "failed-chart", title: "Fehlversuche pro Tag", sub: "Home Assistant und Worker", rows: s.days, series: SEC_SERIES, fmt: (n) => String(n), showTable: view.secTable, toggle: "sec" })}${sourcesCard(s)}</div>
        <div class="grid two mt">${score.html}${blockedCard(d, s)}</div>
        <div class="mt">${sessionsCard(d)}</div>
        <div class="mt">${canaryCard(d)}</div>
        <div class="mt">${secLogCard(d, view.secLog)}</div>`,
      bind: () => {
        bindStack("failed-chart", s.days, SEC_SERIES, opts, (n) => String(n));
        bindScore(score.points);
      },
    };
  }

  // ---------------------------------------------------------- availability
  const OUTAGE = {
    planned: ["Geplanter Neustart", "var(--s2)"], reboot: ["Rechner neu gestartet", "var(--s1)"], restart: ["Neustart ohne Ankündigung", "var(--s1)"],
    network: ["Netzwerk / Internet", "var(--s1)"], open: ["Funkstille", "var(--critical)"],
  };
  const UP_SERIES = [{ key: "unplanned", label: "Ungeplant", color: "var(--s1)" }, { key: "planned", label: "Geplant", color: "var(--s2)" }];
  const minutes = (s) => (s < 60 ? `${Math.round(s)} s` : s < 3600 ? `${Math.round(s / 60)} Min.` : duration(s));
  const pct = (v) => `${(Math.floor(v * 10000) / 100).toLocaleString("de-DE", { minimumFractionDigits: 2, maximumFractionDigits: 2 })} %`;

  function analyseUptime(d) {
    const since = d.now - d.days * 86400;
    const from = Math.max(since, d.uptime_since || since);
    const days = dayRows(d, () => ({ unplanned: 0, planned: 0, covered: 0 }));
    const list = (d.outages || []).map((o) => ({ ...o, s: Math.max(o.start, since), e: Math.min(o.end == null ? d.now : o.end, d.now) })).filter((o) => o.e >= o.s);
    let planned = 0;
    let unplanned = 0;
    for (const o of list) {
      const key = o.kind === "planned" ? "planned" : "unplanned";
      let t = o.s;
      while (t < o.e) {
        const next = Math.min(o.e, t - secOfDay(t) + 86400);
        const row = days.get(dayKey(t));
        if (row) row[key] += next - t;
        t = next > t ? next : o.e;
      }
      if (key === "planned") planned += o.e - o.s;
      else unplanned += o.e - o.s;
    }
    const rows = [...days.values()].slice(-d.days);
    for (const r of rows) r.covered = r.ts - secOfDay(r.ts) + 86400 > (d.uptime_since || 0);
    const span = Math.max(1, d.now - from);
    const open = list.find((o) => o.end == null);
    const unplannedList = list.filter((o) => o.kind !== "planned");
    return {
      rows, list: [...list].reverse(), span, from, open,
      availability: Math.max(0, 1 - (planned + unplanned) / span),
      unplannedAvailability: Math.max(0, 1 - unplanned / span),
      planned, unplanned,
      count: unplannedList.length, plannedCount: list.length - unplannedList.length,
      longest: unplannedList.reduce((m, o) => Math.max(m, o.e - o.s), 0),
    };
  }

  function stripCard(u, d) {
    const weekly = d.days > 90;
    const cells = [];
    if (weekly) {
      for (let i = 0; i < u.rows.length; i += 7) {
        const part = u.rows.slice(i, i + 7);
        cells.push({ ts: part[0].ts, end: part[part.length - 1].ts, down: part.reduce((n, r) => n + r.unplanned + r.planned, 0), covered: part.some((r) => r.covered), len: part.length });
      }
    } else for (const r of u.rows) cells.push({ ts: r.ts, end: r.ts, down: r.unplanned + r.planned, covered: r.covered, len: 1 });
    const color = (c) => (!c.covered ? "var(--chip-bg)" : c.down === 0 ? "var(--good)" : c.down <= 0.01 * 86400 * c.len ? "var(--warning)" : "var(--critical)");
    const label = (c) => (!c.covered ? "keine Daten" : c.down === 0 ? "keine Ausfälle" : `${minutes(c.down)} Ausfall`);
    const strip = `<div class="strip" role="img" aria-label="Verfügbarkeit pro ${weekly ? "Woche" : "Tag"}">${cells.map((c) => `<i style="--c:${color(c)}" title="${esc(weekly ? `${dayShort(c.ts)}–${dayShort(c.end)}` : weekday(c.ts))}: ${esc(label(c))}"></i>`).join("")}</div>
      <div class="strip-axis"><span>${esc(dayShort(cells[0] ? cells[0].ts : d.now))}</span><span>heute</span></div>
      <div class="chart-legend mt8"><span><i class="sw" style="background:var(--good)"></i>Keine Ausfälle</span><span><i class="sw" style="background:var(--warning)"></i>Unter 1 %</span><span><i class="sw" style="background:var(--critical)"></i>1 % und mehr</span><span><i class="sw" style="background:var(--chip-bg)"></i>Keine Daten</span></div>`;
    return card(`Verfügbarkeit pro ${weekly ? "Woche" : "Tag"}`, strip, { sub: "Ausfallzeit inklusive geplanter Neustarts" });
  }

  function outagesCard(u) {
    const rows = u.list.slice(0, view.upLimit);
    const body = rows.length ? `<div class="table-wrap"><table><thead><tr><th>Beginn</th><th>Art</th><th class="num">Dauer</th><th class="hide-sm">Ursache</th></tr></thead><tbody>
      ${rows.map((o) => {
        const [l, c] = OUTAGE[o.kind] || [o.kind, "var(--gray)"];
        return `<tr><td class="t">${esc(dateTime(o.start))}</td><td><span class="tag dotted" style="--c:${c}">${esc(l)}</span>${o.armed ? ` <span class="faint small">scharf</span>` : ""}</td>
          <td class="num">${o.end == null ? `<span class="pill bad">läuft</span>` : esc(minutes(o.end - o.start))}</td><td class="hide-sm msg small">${esc(o.cause || "")}</td></tr>`;
      }).join("")}</tbody></table></div>
      ${u.list.length > rows.length ? `<div class="more"><button class="btn sm" data-upmore>Weitere ${Math.min(50, u.list.length - rows.length)} anzeigen</button></div>` : ""}` : `<div class="empty">Keine Ausfälle im Zeitraum.</div>`;
    return card("Ausfälle und Neustarts", body, { flush: true, right: `<span class="faint small">${u.list.length} Einträge</span>` });
  }

  function renderUptime(d) {
    const u = analyseUptime(d);
    const hb = d.hb;
    const tone = !hb ? "idle" : hb.offline ? (isArmed(hb.state) ? "down" : "warn") : u.unplannedAvailability >= 0.999 ? "ok" : u.unplannedAvailability >= 0.99 ? "warn" : "down";
    const last = u.list.find((o) => o.end != null);
    const sub = [hb && hb.offline ? `Keine Verbindung seit ${dateTime(hb.received)}` : last ? `Letzter Ausfall ${rel(last.end)}` : "Keine Ausfälle", `überwacht seit ${dateTime(d.uptime_since || u.from)}`].join(" · ");
    const peak = Math.max(1, ...u.rows.map((r) => (r.unplanned + r.planned) / 60));
    const maxDay = [4, 8, 12, 20, 40, 60, 80, 120, 180, 240, 360, 480, 720, 1440].find((m) => m >= peak) || 1440;
    const opts = { max: maxDay * 60, ticks: [0, 0.25, 0.5, 0.75, 1].map((f) => f * maxDay * 60), tick: (t) => (maxDay >= 180 ? `${t / 3600}h` : `${t / 60}`), label: "Ausfallminuten pro Tag" };
    return {
      html: `${hero({
        tone, icon: ICON.pulse, title: esc(`${pct(u.availability)} verfügbar`), sub: esc(sub),
        side: `<span class="pill ${tone === "ok" ? "ok" : tone === "down" ? "bad" : "warn"}">Ohne geplante: ${esc(pct(u.unplannedAvailability))}</span>`,
        stats: [
          { v: String(u.count), l: "Ungeplante Ausfälle", cls: u.count ? "warn" : "" },
          { v: String(u.plannedCount), l: "Geplante Neustarts" },
          { v: u.planned + u.unplanned ? minutes(u.planned + u.unplanned) : "0", l: "Ausfallzeit gesamt" },
          { v: u.longest ? minutes(u.longest) : "–", l: "Längster Ausfall" },
        ],
      })}
        ${rangeRow("Zeitraum")}
        <div class="mt">${stripCard(u, d)}</div>
        <div class="mt">${stackCard({ id: "up-chart", title: "Ausfallzeit pro Tag", sub: "Minuten, ungeplant und geplant", rows: u.rows, series: UP_SERIES, fmt: minutes, showTable: view.upTable, toggle: "up" })}</div>
        <div class="mt">${outagesCard(u)}</div>`,
      bind: () => bindStack("up-chart", u.rows, UP_SERIES, opts, minutes),
    };
  }

  // ---------------------------------------------------------- dashboard
  const view = { days: 30, table: false, log: "all", logLimit: 25, secTable: false, secLog: "all", secLimit: 25, upTable: false, upLimit: 25, data: null };
  const TABS = { "#sicherheit": ["security", "Sicherheit"], "#verfuegbarkeit": ["uptime", "Verfügbarkeit"] };

  async function loadDashboard() {
    try {
      view.data = await api(`/api/summary?days=${view.days}`);
      TZ = (view.data.hb && view.data.hb.tz) || TZ;
      document.getElementById("instance").textContent = (view.data.hb && view.data.hb.instance) || "Bastion";
      const who = view.data.user || "";
      document.getElementById("who").textContent = who;
      document.getElementById("avatar").textContent = (who[0] || "B").toUpperCase();
      renderDashboard();
    } catch (err) {
      app.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }

  function renderDashboard() {
    const d = view.data;
    const [tab, title] = TABS[location.hash] || ["alarm", "Alarmanlage"];
    document.querySelectorAll("[data-nav]").forEach((el) => el.classList.toggle("active", el.dataset.nav === tab));
    document.getElementById("title").textContent = title;
    const hb = d.hb;
    document.getElementById("badge-alarm").textContent = hb && (hb.state === "triggered" || hb.state === "pending" || hb.offline) ? "!" : "";
    const urgent = d.security ? (d.security.counts.critical || 0) + (d.security.counts.high || 0) : 0;
    const decoys = (d.canary || []).filter((c) => c.ts >= d.now - 86400).length;
    document.getElementById("badge-sec").textContent = decoys ? "!" : urgent ? String(urgent) : "";
    document.getElementById("badge-up").textContent = hb && hb.offline ? "!" : "";
    document.getElementById("updated").textContent = `Aktualisiert ${timeOnly(d.now).slice(0, 5)}`;
    const page = tab === "security" ? renderSecurity(d) : tab === "uptime" ? renderUptime(d) : renderAlarm(d);
    app.innerHTML = page.html;
    page.bind();
    app.querySelectorAll("[data-days]").forEach((b) => b.addEventListener("click", () => { view.days = Number(b.dataset.days); loadDashboard(); }));
    app.querySelectorAll("[data-log]").forEach((b) => b.addEventListener("click", () => { view.log = b.dataset.log; view.logLimit = 25; renderDashboard(); }));
    app.querySelectorAll("[data-seclog]").forEach((b) => b.addEventListener("click", () => { view.secLog = b.dataset.seclog; view.secLimit = 25; renderDashboard(); }));
    app.querySelectorAll("[data-toggle-table]").forEach((b) => b.addEventListener("click", () => {
      if (b.dataset.toggleTable === "sec") view.secTable = !view.secTable;
      else if (b.dataset.toggleTable === "up") view.upTable = !view.upTable;
      else view.table = !view.table;
      renderDashboard();
    }));
    app.querySelectorAll("tr[data-href]").forEach((tr) => tr.addEventListener("click", () => { location.href = tr.dataset.href; }));
    const more = app.querySelector("[data-more]");
    if (more) more.addEventListener("click", () => { view.logLimit += 50; renderDashboard(); });
    const secMore = app.querySelector("[data-secmore]");
    if (secMore) secMore.addEventListener("click", () => { view.secLimit += 50; renderDashboard(); });
    const upMore = app.querySelector("[data-upmore]");
    if (upMore) upMore.addEventListener("click", () => { view.upLimit += 50; renderDashboard(); });
    app.querySelectorAll("[data-remote]").forEach((b) => b.addEventListener("click", () => { if (!remoteUi.busy) sendCommand(b.dataset.remote, false); }));
    app.querySelectorAll("[data-remote-force]").forEach((b) => b.addEventListener("click", () => { if (!remoteUi.busy) sendCommand(b.dataset.remoteForce, true); }));
    const dismiss = app.querySelector("[data-remote-dismiss]");
    if (dismiss) dismiss.addEventListener("click", () => { remoteUi.intent = null; history.replaceState(null, "", location.pathname + location.hash); renderDashboard(); });
    const code = app.querySelector("#pair-code");
    if (code) {
      code.addEventListener("input", () => { remoteUi.code = code.value; });
      code.addEventListener("keydown", (ev) => { if (ev.key === "Enter" && !remoteUi.busy) pairPasskey(); });
    }
    const pair = app.querySelector("[data-pair]");
    if (pair) pair.addEventListener("click", () => { if (!remoteUi.busy) pairPasskey(); });
    const pairOpen = app.querySelector("[data-pair-open]");
    if (pairOpen) pairOpen.addEventListener("click", () => { remoteUi.pairOpen = true; renderDashboard(); });
  }

  // ------------------------------------------------------------ incident
  async function loadIncident(id, token) {
    if (token) document.body.classList.add("bare");
    const q = token ? `?t=${encodeURIComponent(token)}` : "";
    try {
      const d = await api(`/api/incident/${id}${q}`);
      TZ = d.tz || TZ;
      if (d.instance) document.getElementById("instance").textContent = d.instance;
      renderIncident(d, token);
    } catch (err) {
      app.innerHTML = `<div class="error">${esc(err.message)}</div>`;
    }
  }

  function renderIncident(d, token) {
    const ev = d.events;
    const trig = ev.find((e) => e.event === "triggered");
    const first = ev.find((e) => e.event === "pending" || e.event === "triggered") || ev[0];
    const ack = ev.find((e) => e.event === "acknowledged");
    const dis = ev.find((e) => e.event === "disarmed");
    const start = ev.length ? ev[0].ts : null;
    document.getElementById("title").textContent = `Fall #${d.incident.slice(0, 8).toUpperCase()}`;
    document.querySelectorAll("[data-nav]").forEach((el) => el.classList.toggle("active", el.dataset.nav === "alarm"));
    app.innerHTML = `
      ${token ? "" : `<div class="row mb" style="margin-bottom:12px"><a class="btn sm" href="/">${ICON.back}Übersicht</a></div>`}
      ${hero({
        tone: trig ? "down" : "warn", icon: ICON.alert,
        title: esc(`${trig ? "Alarm" : "Vorwarnung"} · ${first ? where(first) || LABELS[first.event] : "Vorfall"}`),
        sub: esc(start ? fmt(start, { weekday: "long", day: "2-digit", month: "long", year: "numeric", hour: "2-digit", minute: "2-digit" }) : ""),
        stats: [
          { v: String(ev.length), l: "Ereignisse" },
          { v: String(d.snapshots.length), l: "Kamerabilder" },
          { v: ack ? ack.user || "Pushover" : "–", l: "Quittiert" },
          { v: dis && start ? duration(dis.ts - start) : "–", l: "Bis unscharf", cls: dis ? "ok" : "" },
        ],
      })}
      <div class="mt">${card("Ablauf", `<ul class="timeline">${ev.map((e) => `<li><span class="t">${esc(timeOnly(e.ts))}</span><span class="dot" style="--c:${EV_COLOR[e.event] || "var(--gray)"}"></span>
        <span><b>${esc(LABELS[e.event] || e.event)}</b>${where(e) ? ` · ${esc(where(e))}` : ""}${e.user ? ` · ${esc(e.user)}` : ""}${e.mode && MODES[e.mode] && e.event !== "acknowledged" ? ` <span class="faint">· ${MODES[e.mode]}</span>` : ""}</span></li>`).join("") || `<li class="faint">Keine Ereignisse.</li>`}</ul>`, { flush: true })}</div>
      <div class="mt">${card("Kamerabilder", d.snapshots.length ? `<div class="gallery">${d.snapshots.map((s) => `<figure class="shot" data-shot="${s.id}"><div class="ph">lädt …</div>
        <figcaption><span>${esc(s.camera || "Kamera")}</span><span class="grow"></span><span>${esc(timeOnly(s.ts))}</span></figcaption></figure>`).join("")}</div>` : `<div class="empty">Keine Kamerabilder zu diesem Vorfall.</div>`, { flush: true })}</div>`;
    loadShots(d, token);
  }

  // -------------------------------------------------------------- route
  const m = location.pathname.match(/^\/i\/([a-f0-9]{8,32})$/);
  if (m) {
    const token = new URLSearchParams(location.search).get("t") || "";
    loadIncident(m[1], token);
  } else {
    loadDashboard();
    // No refresh while a passkey dialog runs or the pairing code is being typed.
    const idle = () => !document.hidden && !remoteUi.busy && !(document.activeElement && document.activeElement.id === "pair-code");
    setInterval(() => { if (idle()) loadDashboard(); }, 60000);
    // Back in the foreground (installed app), show fresh data right away.
    document.addEventListener("visibilitychange", () => { if (!document.hidden && view.data && Date.now() / 1000 - view.data.now > 20) loadDashboard(); });
    window.addEventListener("online", () => loadDashboard());
    if ("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js", { scope: "/" }).catch(() => { /* not available, e.g. private mode */ });
    let resizeTimer = null;
    window.addEventListener("hashchange", () => { if (view.data) renderDashboard(); });
    window.addEventListener("resize", () => { clearTimeout(resizeTimer); resizeTimer = setTimeout(() => { if (view.data) renderDashboard(); }, 150); });
  }
})();
</script>
</body>
</html>
