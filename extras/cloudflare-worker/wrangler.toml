name = "bastion-probe"
main = "src/worker.js"
compatibility_date = "2025-09-01"
workers_dev = true

# Dashboard und Vorfallseite als Text-Modul.
[[rules]]
type = "Text"
globs = ["**/*.html"]
fallthrough = true

# Totmannschalter, Quittierungen, Aufbewahrung: jede Minute.
[triggers]
crons = ["* * * * *"]

# Protokoll, Kamerabilder, Lebenszeichen: `npx wrangler d1 create bastion`
# und die ausgegebene database_id hier eintragen. Tabellen legt der Worker selbst an.
[[d1_databases]]
binding = "DB"
database_name = "bastion"
database_id = "REPLACE_WITH_D1_DATABASE_ID"

# Dashboard hinter Cloudflare Access (optional, siehe DOKU.md):
# [vars]
# DASHBOARD_HOST = "bastion.example.com"
# ACCESS_TEAM_DOMAIN = "<team>.cloudflareaccess.com"
# ACCESS_AUD = "<Application Audience (AUD) Tag>"
# ACCESS_ALERT = "new"   # Meldung bei Dashboard-Zugriff: "new" (neues Gerät/Land), "all", "off"

# Secrets (nie in diese Datei schreiben):
#   npx wrangler secret put PROBE_TOKEN
#   npx wrangler secret put ALARM_SECRET          (Wert aus Bastion → Alarmanlage → Einstellungen → Cloud-Worker)
#   npx wrangler secret put PUSHOVER_TOKEN        (optional, App-Token von pushover.net)
#   npx wrangler secret put PUSHOVER_USER         (optional, User-Key von pushover.net)
#   npx wrangler secret put TELEGRAM_BOT_TOKEN    (optional)
#   npx wrangler secret put TELEGRAM_CHAT_ID      (optional)
#   npx wrangler secret put NTFY_URL              (optional, z. B. https://ntfy.sh/<geheimes-topic>)
