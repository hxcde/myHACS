name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - name: Install
        run: |
          pip install -r requirements_test.txt ruff
          pip install "$(python -c "import json,homeassistant,os;p=os.path.join(os.path.dirname(homeassistant.__file__),'components','frontend','manifest.json');print(json.load(open(p))['requirements'][0])")"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Test
        run: pytest -q
